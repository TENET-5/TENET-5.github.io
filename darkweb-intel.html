<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Web Intelligence | TENET5 OSINT</title>
  <meta name="description" content="TENET5 Dark Web intelligence feed. Monitoring indices, threat actors, and indexed Tor nodes via LIRIL pipeline.">
  <meta name="theme-color" content="#050810">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F577;</text></svg>">
  <link rel="stylesheet" href="style.css?v=6">
  <style>
    .dossier-wrap { max-width: 960px; margin: 0 auto; padding: 20px; font-family: 'JetBrains Mono', 'Courier New', monospace; color: var(--text-primary); }

    .dossier-header { text-align: center; padding: 40px 0 20px; border-bottom: 2px solid rgba(57, 255, 20, 0.3); margin-bottom: 30px; }
    .dossier-header h1 { font-family: 'Playfair Display', serif; font-size: 2.2rem; color: var(--text-primary); letter-spacing: -1px; margin-bottom: 8px; }
    .dossier-header .subtitle { font-size: 0.85rem; color: var(--text-tertiary); }

    .sys-status { 
      background: rgba(10, 10, 15, 0.95); 
      border: 1px solid rgba(57, 255, 20, 0.25); 
      border-radius: 8px; 
      padding: 14px 20px; 
      margin-bottom: 24px; 
      font-size: 0.75rem; 
      color: #39ff14; 
      text-transform: uppercase; 
      letter-spacing: 1.5px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .sys-status .label { color: var(--text-tertiary); }
    .sys-status .online { color: #39ff14; font-weight: 700; }

    /* Search & Metrics */
    .search-bar { width: 100%; padding: 12px; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(57, 255, 20, 0.3); color: #c8c8ce; border-radius: 8px; margin-bottom: 15px; font-family: inherit;}
    .search-bar:focus { outline: none; border-color: #39ff14; }
    
    .grid-container {
        display: grid;
        grid-template-columns: 300px 1fr;
        gap: 20px;
    }
    @media (max-width: 768px) { .grid-container { grid-template-columns: 1fr; } }
    
    .index-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-height: 600px;
        overflow-y: auto;
    }
    .index-item {
        background: var(--bg-card);
        border: 1px solid rgba(255, 255, 255, 0.05);
        padding: 15px;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.2s;
    }
    .index-item:hover, .index-item.active {
        border-color: #ff006e;
        background: #161618;
    }
    .index-item h4 { margin: 0 0 5px 0; font-size: 0.9rem; color: #fff;}
    .index-item .hash { font-size: 0.65rem; color: #ff006e; }
    
    .viewer {
        background: var(--bg-surface);
        border: 1px solid rgba(255,255,255,0.05);
        border-radius: 8px;
        padding: 30px;
        min-height: 500px;
        color: #c8c8ce;
        line-height: 1.6;
        font-size: 0.88rem;
    }
    .viewer h2 { color: #39ff14; font-size: 1.4rem; margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 10px;}
    .viewer .url { font-size: 0.8rem; color: #60a5fa; margin-bottom: 20px; display: block; }
    .viewer .content { white-space: pre-wrap; font-family: 'Courier New', Courier, monospace; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 6px; }
  </style>

<!-- TENET5 SEO INJECT -->
  <meta property="og:title" content="Dark Web Intelligence | TENET5">
  <meta property="og:url" content="https://tenet-5.github.io/darkweb-intel.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="TENET5 Accountability">
<!-- END SEO INJECT -->

</head>
<body>
  <div id="nav-placeholder"></div>

  <div class="dossier-wrap">
    <div class="dossier-header">
      <h1>Dark Web Intelligence</h1>
      <div class="subtitle">TENET5 Autonomous Tor Crawl Indexes</div>
    </div>

    <div class="sys-status">
      <div><span class="label">Node:</span> LIRIL-DARKWEB-1</div>
      <div><span class="label">Connection:</span> <span class="online">SECURE VIA STARK-ROUTER</span></div>
      <div><span class="label">Total Indexed:</span> <span id="idx-count">0</span></div>
    </div>

    <input type="text" class="search-bar" id="search" placeholder="Search indices via STARK matrix hash or keywords...">

    <div class="grid-container">
        <div class="index-list" id="index-list">
            <!-- Dynamically populated from STARK REST Bridge -->
            <div id="loader" style="padding:20px; color:#c41e3a; font-size:0.8rem; text-align:center;">CONNECTING TO LOCAL LIRIL NODE...</div>
        </div>

        <div class="viewer" id="viewer">
            <h2 id="v-title">No Document Selected</h2>
            <span class="url" id="v-url">Awaiting node decryption</span>
            <div class="content" id="v-content" style="display:none;">
            </div>
            <div id="v-placeholder" style="opacity:0.4; font-size:2rem; text-align:center; margin-top:20%">&#x1F577;</div>
        </div>
    </div>
  </div>

  <script src="nav.js?v=9"></script>
  <script>
    // Navigation Inject
    const tpTpl = buildNavHtml();
    document.getElementById('nav-placeholder').innerHTML = tpTpl;
    if(typeof attachNavEvents === 'function') attachNavEvents();

    let docs = [];

    // STARK NATS/REST Bridge Fetcher
    async function fetchDiscoveries() {
        try {
            // Target the unified daemon HTTP port created via Phase 13 Hydrogen logic
            const response = await fetch('http://127.0.0.1:8091/api/discoveries');
            if(!response.ok) throw new Error('Daemon Offline');
            
            const payload = await response.json();
            
            if (payload && payload.status === "success") {
                document.getElementById('loader').style.display = 'none';
                docs = payload.data || [];
                renderList();
            }
        } catch(error) {
            console.error(error);
            document.getElementById('idx-count').innerText = "DISCONNECTED";
            document.getElementById('loader').innerText = "ERROR: LIRIL NODE DAEMON TARGET OFFLINE [HTTP 127.0.0.1:8091]. START THE DAEMON.";
        }
    }

    function renderList(filterTerm = "") {
        const listDiv = document.getElementById('index-list');
        listDiv.innerHTML = "";
        
        const filtered = docs.filter(d => 
            (d.discovery_key && d.discovery_key.toLowerCase().includes(filterTerm.toLowerCase())) ||
            (d.discovery_value && JSON.stringify(d.discovery_value).toLowerCase().includes(filterTerm.toLowerCase()))
        );

        document.getElementById('idx-count').innerText = filtered.length;

        if (filtered.length === 0) {
            listDiv.innerHTML = `<div style="color:#888; padding:10px; font-size:0.8rem;">No indices match convergence parameters.</div>`;
            return;
        }

        filtered.forEach((item, idx) => {
            const timeStr = new Date(item.timestamp * 1000).toLocaleString();
            let title = item.discovery_key; // Fallback
            if (item.discovery_value && item.discovery_value.title) {
                title = item.discovery_value.title;
            } else if (item.discovery_value && item.discovery_value.event) {
                title = `Telemetry: ${item.discovery_value.event}`; 
            }

            const el = document.createElement('div');
            el.className = "index-item";
            el.innerHTML = `
                <h4>${title}</h4>
                <div class="hash">${item.crypto_signature.substring(0,24)}...</div>
                <div style="font-size: 0.7rem; color: #888; margin-top: 4px;">Node Time: ${timeStr}</div>
            `;
            // Save stringified JSON string properly to loadDoc param
            el.onclick = () => loadDoc(item, el);
            listDiv.appendChild(el);
        });
    }

    function loadDoc(item, clickEl) {
        document.querySelectorAll('.index-item').forEach(e => e.classList.remove('active'));
        if (clickEl) clickEl.classList.add('active');

        // Extract internal JSON properties 
        let title = item.discovery_key;
        let url = "INTERNAL LIRIL DATALINK";
        let content = JSON.stringify(item.discovery_value, null, 2);

        if (item.discovery_value) {
            if (item.discovery_value.title) title = item.discovery_value.title;
            if (item.discovery_value.url) url = item.discovery_value.url;
            if (item.discovery_value.content) content = item.discovery_value.content;
        }

        document.getElementById('v-title').innerText = title;
        document.getElementById('v-url').innerText = `tor://${url.replace('http://', '')}`;
        document.getElementById('v-content').innerText = content;
        
        document.getElementById('v-placeholder').style.display = 'none';
        document.getElementById('v-content').style.display = 'block';
    }

    // Attach search
    document.getElementById('search').addEventListener('input', (e) => renderList(e.target.value));

    // Initial Bootstrap
    fetchDiscoveries();
    
    // Poll loop every 3 seconds for live telemetry
    setInterval(fetchDiscoveries, 3000);
  </script>
</body>
</html>
