<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TENET5 — Canadian Accountability OSINT Platform</title>
  <link rel="stylesheet" href="style.css?v=18">
  <link rel="stylesheet" href="css/inline_generated.css">
  <style>
    body, html {
      margin: 0; padding: 0; height: 100%; overflow: hidden; display: flex; flex-direction: column;
      background-color: var(--bg); color: var(--text-primary);
    }
    #content_frame {
      flex-grow: 1; border: none; width: 100%;
      background: var(--bg);
    }
    .site-footer { display: none !important; }
  </style>
</head>
<body>

  <div id="site-header-frame"></div>
<iframe name="content_frame" id="content_frame" src="home.html"></iframe>

    <script>
      const iframe = document.getElementById('content_frame');
      const urlParams = new URLSearchParams(window.location.search);
      const loadPage = urlParams.get('load');
      
      if (loadPage) {
          iframe.src = loadPage;
      }
      
      iframe.addEventListener('load', () => {
          try {
              let framePath = iframe.contentWindow.location.pathname.split('/').pop() || 'home.html';
              if (framePath !== 'home.html') {
                  const newUrl = window.location.pathname + "?load=" + framePath;
                  window.history.replaceState(null, '', newUrl);
              } else {
                  window.history.replaceState(null, '', window.location.pathname);
              }
          } catch(e) {} // Offline/CORS block fallback
      });
    </script>

  <div id="site-footer-frame"></div>
  <script src="shell.js?v=2"></script>
<script src="js/ux.js"></script>
<script src="js/slate.js"></script>
<script src="js/cinema.js"></script>
</body>
</html>
