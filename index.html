      const shellBust = '20260415walkfix';

      function withShellBust(url) {
          if (!url) return url;
          const joiner = url.includes('?') ? '&' : '?';
          return url + joiner + 'cb=' + encodeURIComponent(shellBust);
      }

      if (loadPage) {
          iframe.src = withShellBust(loadPage);

          try {

              if (framePath !== 'home.html') {
                  const newUrl = window.location.pathname + "?load=" + encodeURIComponent(framePath + frameSearch);

              } else {
                  window.history.replaceState(null, '', window.location.pathname);

<div id="t5-music-station"

<iframe id="t5-music-frame"
        title="TENET5 music — Seek and Destroy (hidden player)"
        allow="autoplay; encrypted-media"
        src="about:blank"
        loading="lazy"
        aria-hidden="true"></iframe>
<script>
(function(){
  // Seek and Destroy — Metallica. Video ID pinned for reproducibility.
  var VID = 'FLTchCiC0T0';
  var btn = document.getElementById('t5-music-station');
  var frame = document.getElementById('t5-music-frame');
  var glyph = btn.querySelector('.t5-ms-glyph');
  var playing = false;

  function src(autoplay, mute){
    return 'https://www.youtube.com/embed/' + VID +
           '?autoplay=' + (autoplay?1:0) +
           '&loop=1&playlist=' + VID +
           '&mute=' + (mute?1:0) +
           '&modestbranding=1&playsinline=1&rel=0';
  }

  function toggle(){
    if(!playing){
      // Browsers permit unmuted autoplay only after a real user gesture —
      // this handler IS that gesture, so we ship unmuted directly.
      frame.src = src(true, false);
      playing = true;
      btn.classList.add('playing');
      glyph.textContent = '❚❚';
      btn.setAttribute('aria-label','Pause Seek and Destroy');
    } else {
      frame.src = 'about:blank';
      playing = false;
      btn.classList.remove('playing');
      glyph.textContent = '♪';
      btn.setAttribute('aria-label','Play Seek and Destroy');
    }
  }

  btn.addEventListener('click', toggle);
  btn.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(); }
  });
  btn.addEventListener('dblclick', function(){
    window.open('https://music.youtube.com/watch?v=' + VID, '_blank', 'noopener');
  });
})();
</script>
