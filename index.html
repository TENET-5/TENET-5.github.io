    <script>
      const iframe = document.getElementById('content_frame');
      const urlParams = new URLSearchParams(window.location.search);
      const loadPage = urlParams.get('load');
      const shellBust = '20260415walkfix';

      function withShellBust(url) {
          if (!url) return url;
          const joiner = url.includes('?') ? '&' : '?';
          return url + joiner + 'cb=' + encodeURIComponent(shellBust);
      }
      
      if (loadPage) {
          iframe.src = withShellBust(loadPage);
      }
      
      iframe.addEventListener('load', () => {
          try {
              let framePath = iframe.contentWindow.location.pathname.split('/').pop() || 'home.html';
              let frameSearch = iframe.contentWindow.location.search || '';
              if (framePath !== 'home.html') {
                  const newUrl = window.location.pathname + "?load=" + encodeURIComponent(framePath + frameSearch);
                  window.history.replaceState(null, '', newUrl);
              } else {
                  window.history.replaceState(null, '', window.location.pathname);
              }
          } catch(e) {} // Offline/CORS block fallback
      });

      // Cross-page presentation navigation via postMessage from iframe
      window.addEventListener('message', function(e) {
          if (e.data && e.data.type === 'pres-navigate' && e.data.page) {
              iframe.src = withShellBust(e.data.page);
          }
      });
    </script>
