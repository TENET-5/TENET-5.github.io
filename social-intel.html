<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Media Intelligence | TENET5 OSINT</title>
  <meta name="description" content="TENET5 Social Media tracking feed. Monitoring platform metrics, botnets, and influence vectors via LIRIL.">
  <meta name="theme-color" content="#050810">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F4AC;</text></svg>">
  <link rel="stylesheet" href="style.css?v=6">
  <style>
    .dossier-wrap { max-width: 960px; margin: 0 auto; padding: 20px; font-family: 'JetBrains Mono', 'Courier New', monospace; color: var(--text-primary); }

    .dossier-header { text-align: center; padding: 40px 0 20px; border-bottom: 2px solid #60a5fa; margin-bottom: 30px; }
    .dossier-header h1 { font-family: 'Playfair Display', serif; font-size: 2.2rem; color: var(--text-primary); letter-spacing: -1px; margin-bottom: 8px; }
    .dossier-header .subtitle { font-size: 0.85rem; color: var(--text-tertiary); }

    .sys-status { 
      background: rgba(10, 10, 15, 0.95); 
      border: 1px solid rgba(96, 165, 250, 0.25); 
      border-radius: 8px; 
      padding: 14px 20px; 
      margin-bottom: 24px; 
      font-size: 0.75rem; 
      color: #60a5fa; 
      text-transform: uppercase; 
      letter-spacing: 1.5px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .sys-status .label { color: var(--text-tertiary); }
    .sys-status .online { color: #60a5fa; font-weight: 700; }

    /* Search & Metrics */
    .search-bar { width: 100%; padding: 12px; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(96, 165, 250, 0.3); color: #c8c8ce; border-radius: 8px; margin-bottom: 15px; font-family: inherit;}
    .search-bar:focus { outline: none; border-color: #60a5fa; }
    
    .grid-container {
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 20px;
    }
    @media (max-width: 768px) { .grid-container { grid-template-columns: 1fr; } }
    
    .index-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-height: 600px;
        overflow-y: auto;
        padding-right: 5px;
    }
    .index-list::-webkit-scrollbar { width: 4px; }
    .index-list::-webkit-scrollbar-thumb { background: #60a5fa; border-radius: 2px; }

    .index-item {
        background: var(--bg-card);
        border: 1px solid rgba(255, 255, 255, 0.05);
        padding: 15px;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.2s;
    }
    .index-item:hover, .index-item.active {
        border-color: #60a5fa;
        background: #161618;
    }
    .index-item .platform-badge { font-size: 0.6rem; background: #60a5fa; color: #fff; padding: 2px 6px; border-radius: 4px; float: right;}
    .index-item h4 { margin: 0 0 5px 0; font-size: 0.9rem; color: #fff; display: flex; align-items: center; justify-content: space-between;}
    .index-item .content-preview { font-size: 0.75rem; color: #aaa; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .index-item .hash { font-size: 0.65rem; color: #60a5fa; }
    
    .viewer {
        background: var(--bg-surface);
        border: 1px solid rgba(255,255,255,0.05);
        border-radius: 8px;
        padding: 30px;
        min-height: 500px;
        color: #c8c8ce;
        line-height: 1.6;
        font-size: 0.88rem;
    }
    .viewer h2 { color: #fff; font-size: 1.2rem; margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 10px; display:flex; justify-content: space-between; align-items: center;}
    .viewer .meta-badge { font-size: 0.7rem; background: rgba(96,165,250,0.2); border: 1px solid #60a5fa; color: #60a5fa; padding: 2px 8px; border-radius: 4px; }
    .viewer .author { font-size: 0.9rem; color: #60a5fa; margin-bottom: 20px; display: block; font-weight: bold;}
    .viewer .content { white-space: pre-wrap; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: rgba(0,0,0,0.3); padding: 20px; border-radius: 8px; font-size: 1rem; border-left: 3px solid #60a5fa;}
    .viewer .meta-box { margin-top: 20px; font-size: 0.75rem; color: #888; background: #0a0a0c; padding: 10px; border-radius: 4px; }
  </style>

<!-- TENET5 SEO INJECT -->
  <meta property="og:title" content="Social Media Intelligence | TENET5">
  <meta property="og:url" content="https://tenet-5.github.io/social-intel.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="TENET5 Accountability">
<!-- END SEO INJECT -->

</head>
<body>
  <div id="nav-placeholder"></div>

  <div class="dossier-wrap">
    <div class="dossier-header">
      <h1>Social Media Intelligence</h1>
      <div class="subtitle">LIRIL Aggregated Influence Networks</div>
    </div>

    <div class="sys-status">
      <div><span class="label">Node:</span> LIRIL-SOCIAL-1</div>
      <div><span class="label">Connection:</span> <span class="online">ACTIVE</span></div>
      <div><span class="label">Total Indexed:</span> <span id="idx-count">0</span></div>
    </div>

    <input type="text" class="search-bar" id="search" placeholder="Search by author, content, or platform...">

    <div class="grid-container">
        <div class="index-list" id="index-list">
            <div id="loader" style="padding:20px; color:#60a5fa; font-size:0.8rem; text-align:center;">CONNECTING TO LOCAL LIRIL NODE...</div>
        </div>

        <div class="viewer" id="viewer">
            <h2 id="v-title">No Post Selected</h2>
            <span class="author" id="v-author"></span>
            <div class="content" id="v-content" style="display:none;"></div>
            <div class="meta-box" id="v-meta" style="display:none;"></div>
            <div id="v-placeholder" style="opacity:0.4; font-size:2rem; text-align:center; margin-top:20%">&#x1F4AC;</div>
        </div>
    </div>
  </div>

  <script src="nav.js?v=9"></script>
  <script>
    const tpTpl = buildNavHtml();
    document.getElementById('nav-placeholder').innerHTML = tpTpl;
    if(typeof attachNavEvents === 'function') attachNavEvents();

    let posts = [];

    // STARK NATS/REST Bridge Fetcher
    async function fetchDiscoveries() {
        try {
            const response = await fetch('http://127.0.0.1:8091/api/social');
            if(!response.ok) throw new Error('Daemon Offline');
            
            const payload = await response.json();
            
            if (payload && payload.status === "success") {
                document.getElementById('loader').style.display = 'none';
                posts = payload.data || [];
                renderList();
            }
        } catch(error) {
            console.error(error);
            document.getElementById('idx-count').innerText = "DISCONNECTED";
            document.getElementById('loader').innerText = "ERROR: LIRIL NODE DAEMON TARGET OFFLINE [HTTP 127.0.0.1:8091]. START THE DAEMON.";
        }
    }

    function renderList(filterTerm = "") {
        const listDiv = document.getElementById('index-list');
        listDiv.innerHTML = "";
        const term = filterTerm.toLowerCase();
        
        const filtered = posts.filter(d => 
            (d.author && d.author.toLowerCase().includes(term)) ||
            (d.content && d.content.toLowerCase().includes(term)) ||
            (d.platform && d.platform.toLowerCase().includes(term))
        );

        document.getElementById('idx-count').innerText = filtered.length;

        if (filtered.length === 0) {
            listDiv.innerHTML = `<div style="color:#888; padding:10px; font-size:0.8rem;">No posts match search parameters.</div>`;
            return;
        }

        filtered.forEach((item) => {
            const timeStr = new Date(item.timestamp * 1000).toLocaleString();
            
            const el = document.createElement('div');
            el.className = "index-item";
            el.innerHTML = `
                <h4>${item.author} <span class="platform-badge">${item.platform || 'Unknown'}</span></h4>
                <div class="content-preview">${item.content}</div>
                <div class="hash">${item.crypto_signature.substring(0,24)}...</div>
                <div style="font-size: 0.7rem; color: #888; margin-top: 4px;">Indexed: ${timeStr}</div>
            `;
            el.onclick = () => loadPost(item, el);
            listDiv.appendChild(el);
        });
    }

    function loadPost(item, clickEl) {
        document.querySelectorAll('.index-item').forEach(e => e.classList.remove('active'));
        if (clickEl) clickEl.classList.add('active');

        document.getElementById('v-title').innerHTML = `Post Details <span class="meta-badge">${item.platform}</span>`;
        document.getElementById('v-author').innerText = item.author;
        document.getElementById('v-content').innerText = item.content;
        
        let metaStr = `<strong>Crypto Signature:</strong> ${item.crypto_signature}<br><strong>Timestamp:</strong> ${item.timestamp}`;
        if(item.metadata && Object.keys(item.metadata).length > 0) {
            metaStr += `<br><br><strong>Metadata:</strong><br><pre style="margin:0;">${JSON.stringify(item.metadata, null, 2)}</pre>`;
        }
        document.getElementById('v-meta').innerHTML = metaStr;
        
        document.getElementById('v-placeholder').style.display = 'none';
        document.getElementById('v-content').style.display = 'block';
        document.getElementById('v-meta').style.display = 'block';
    }

    document.getElementById('search').addEventListener('input', (e) => renderList(e.target.value));

    fetchDiscoveries();
    setInterval(fetchDiscoveries, 5000);
  </script>
</body>
</html>
