<div id="studio-environment" class="neutral-lighting">
        <!-- The WebGL Canvas for hardware-accelerated shaders -->
        <canvas id="art-canvas"></canvas>

        <!-- Top Navigation / Status -->
        <header class="studio-header glass-panel">
            <div class="logo">PRISM <span>STUDIO</span></div>
            <div class="controls">
                <button id="btn-clear" class="btn-icon" title="Clear Canvas">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                </button>
                <div class="divider"></div>
                <button id="btn-lighting" class="btn-text" title="Toggle Atmosphere">
                    <span class="indicator"></span> Golden Lighting
                </button>
            </div>
        </header>

        <!-- Art Drawer (Tools) -->
        <aside class="art-drawer glass-panel">
            <div class="drawer-header">
                <h3>Studio Tools</h3>
            </div>
            <div class="tool-grid">
                <!-- Pencil -->
                <div class="tool-item active" data-tool="pencil" style="--accent: #2c3e50;">
                    <div class="tool-3d-model pencil-model">
                        <div class="lead"></div>
                        <div class="wood"></div>
                        <div class="body"></div>
                    </div>
                    <span class="tool-name">Graphite Pencil</span>
                </div>
                
                <!-- Watercolor -->
                <div class="tool-item" data-tool="watercolor" style="--accent: #3498db;">
                    <div class="tool-3d-model brush-model">
                        <div class="bristles watercolor-bristles"></div>
                        <div class="ferrule"></div>
                        <div class="handle"></div>
                    </div>
                    <span class="tool-name">Watercolor Wash</span>
                </div>

                <!-- Oil Paint -->
                <div class="tool-item" data-tool="oil" style="--accent: #e74c3c;">
                    <div class="tool-3d-model brush-model">
                        <div class="bristles oil-bristles"></div>
                        <div class="ferrule"></div>
                        <div class="handle"></div>
                    </div>
                    <span class="tool-name">Oil Impasto</span>
                </div>
            </div>

            <div class="color-palette">
                <h4>Palette</h4>
                <div class="color-grid">
                    <div class="color-swatch active" style="background-color: #1a1a1a;" data-color="#1a1a1a"></div>
                    <div class="color-swatch" style="background-color: #e74c3c;" data-color="#e74c3c"></div>
                    <div class="color-swatch" style="background-color: #f1c40f;" data-color="#f1c40f"></div>
                    <div class="color-swatch" style="background-color: #2ecc71;" data-color="#2ecc71"></div>
                    <div class="color-swatch" style="background-color: #3498db;" data-color="#3498db"></div>
                    <div class="color-swatch" style="background-color: #8e44ad;" data-color="#8e44ad"></div>
                    <div class="color-swatch" style="background-color: #ecf0f1;" data-color="#ecf0f1"></div>
                    <div class="color-swatch" style="background-color: #d35400;" data-color="#d35400"></div>
                </div>
            </div>
            
            <div class="brush-settings">
                <h4>Physics</h4>
                <div class="setting-row">
                    <label>Size</label>
                    <input type="range" id="brush-size" min="1" max="100" value="10">
                </div>
                <div class="setting-row">
                    <label>Water</label>
                    <input type="range" id="water-amount" min="0" max="100" value="50">
                </div>
                <div class="setting-row">
                    <label>Load</label>
                    <input type="range" id="paint-load" min="0" max="100" value="100">
                </div>
            </div>

            <div class="canvas-settings">
                <h4>Canvas Tooth</h4>
                <select id="canvas-grain">
                    <option value="fine">Fine Cotton</option>
                    <option value="medium" selected>Medium Linen</option>
                    <option value="rough">Rough Hessian</option>
                </select>
            </div>
        </aside>
    </div>
