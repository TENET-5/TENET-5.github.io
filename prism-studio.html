<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRISM STUDIO - The Classical Workflow</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/prism-studio.css">
</head>
<body>
    <div id="studio-atmosphere"></div>
    
    <header class="cinematic-header">
        <div class="logo">TENET-5 <span>PRISM STUDIO</span></div>
        <div class="header-controls">
            <button id="btn-atmosphere">Ignite Golden Lighting</button>
            <button id="btn-export">Export 4K Masterpiece</button>
            <button id="btn-clear" class="danger">Clear Pedestal</button>
        </div>
    </header>

    <main class="studio-vault">
        <!-- LEFT SHELVES: Dry Media & Watercolor -->
        <aside class="glass-shelf left-shelf">
            <div class="shelf-section">
                <h3>Graphite & Charcoal</h3>
                <div class="tool-rack">
                    <button class="tool-item active" data-tool="pencil" data-size="4" data-load="100" data-water="0">2H Pencil</button>
                    <button class="tool-item" data-tool="pencil" data-size="8" data-load="100" data-water="0">HB Pencil</button>
                    <button class="tool-item" data-tool="pencil" data-size="16" data-load="80" data-water="0">6B Soft Graphite</button>
                    <button class="tool-item" data-tool="pencil" data-size="30" data-load="60" data-water="0">Vine Charcoal</button>
                </div>
            </div>
            
            <div class="shelf-section">
                <h3>Sable Brushes (Wash)</h3>
                <div class="tool-rack">
                    <button class="tool-item" data-tool="watercolor" data-size="12" data-load="50" data-water="80">Fine Detail Sable</button>
                    <button class="tool-item" data-tool="watercolor" data-size="30" data-load="60" data-water="90">Medium Round Wash</button>
                    <button class="tool-item" data-tool="watercolor" data-size="80" data-load="80" data-water="100">Large Mop Brush</button>
                </div>
            </div>

            <div class="shelf-section">
                <h3>Canvas Tooth</h3>
                <select id="canvas-grain">
                    <option value="fine">Fine Cotton Duck</option>
                    <option value="medium" selected>Medium Linen</option>
                    <option value="rough">Rough Hessian</option>
                </select>
            </div>
        </aside>

        <!-- CENTER PEDESTAL: The Canvas -->
        <section class="pedestal-container">
            <div class="pedestal-glow"></div>
            <div class="canvas-wrapper">
                <canvas id="prism-canvas" width="1600" height="1200"></canvas>
            </div>
        </section>

        <!-- RIGHT SHELVES: Oils & Pigments -->
        <aside class="glass-shelf right-shelf">
            <div class="shelf-section">
                <h3>Hog Bristle (Oils)</h3>
                <div class="tool-rack">
                    <button class="tool-item" data-tool="oil" data-size="10" data-load="100" data-water="0">Filbert Detail</button>
                    <button class="tool-item" data-tool="oil" data-size="25" data-load="90" data-water="0">Flat Bright</button>
                    <button class="tool-item" data-tool="oil" data-size="60" data-load="100" data-water="0">Large Impasto</button>
                </div>
            </div>

            <div class="shelf-section">
                <h3>Physical Pigments</h3>
                <div class="color-grid" id="pigment-rack">
                    <div class="color-swatch active" style="background: #2a2a2a" data-color="42,42,42"></div>
                    <div class="color-swatch" style="background: #e6e6e6" data-color="230,230,230"></div>
                    <div class="color-swatch" style="background: #a31d1d" data-color="163,29,29"></div>
                    <div class="color-swatch" style="background: #274b7a" data-color="39,75,122"></div>
                    <div class="color-swatch" style="background: #d6a12b" data-color="214,161,43"></div>
                    <div class="color-swatch" style="background: #2e6332" data-color="46,99,50"></div>
                    <div class="color-swatch" style="background: #472c11" data-color="71,44,17"></div>
                    <div class="color-swatch" style="background: #7a3d16" data-color="122,61,22"></div>
                </div>
            </div>

            <!-- Physics Overrides -->
            <div class="shelf-section">
                <h3>Physics Overrides</h3>
                <div class="setting-row">
                    <label>Water</label>
                    <input type="range" id="water-amount" min="0" max="100" value="50">
                </div>
                <div class="setting-row">
                    <label>Load</label>
                    <input type="range" id="paint-load" min="0" max="100" value="100">
                </div>
            </div>
        </aside>
    </main>

    <!-- BOTTOM: Classical Workflow Layer Discipline -->
    <footer class="workflow-deck">
        <div class="layer-discipline">
            <h3>Discipline</h3>
            <div class="layer-slots">
                <button class="layer-btn" data-layer="2">Final Pass</button>
                <button class="layer-btn" data-layer="1">Glaze</button>
                <button class="layer-btn active" data-layer="0">Underpainting</button>
            </div>
        </div>
        
        <div class="mixing-palette">
            <h3>Wooden Mixing Palette</h3>
            <div class="palette-board">
                <canvas id="mixing-canvas" width="400" height="150"></canvas>
            </div>
        </div>
        
        <div class="privacy-badge" style="margin-left: auto; align-self: center; text-align: right; color: var(--text-secondary);">
            <h3 style="color: var(--moss); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px;">Zero Data Collection</h3>
            <p style="font-size: 0.8rem; line-height: 1.4;">PRISM STUDIO is a free web app.<br>All computing is local. We collect 0 data.</p>
        </div>
    </footer>

    <script src="js/prism-studio-engine.js"></script>
</body>
</html>
