    // Cap#189 (2026-04-26): archive-shell.html used to be a 313-line
    // iframe wrapper with hardcoded <title>="OSINT Intelligence Dashboard"
    // and a default iframe src that visitors mistook for "every page is
    // broken". After Cap#187 removed the SC_FRAME_BUSTER redirect, no
    // page links here anymore — but external/bookmark links of the shape
    //   archive-shell.html?load=treason-trajectory.html#scene-3
    // would still 200 with a wrong-content render. This shim preserves
    // backwards-compat by redirecting to /<load>#<hash> directly.
    (function () {
      try {
        var loadParam = new URLSearchParams(location.search).get('load');
        if (loadParam) {
          var target = '/' + loadParam.replace(/^\//, '') + (location.hash || '');
          location.replace(target);
          return;
        }
      } catch (e) {
        /* no-op — fall through to default */
      }
      location.replace('/');
    })();
  </script>
