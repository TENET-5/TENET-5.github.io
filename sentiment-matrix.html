<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentiment Matrix | TENET5 Analytics</title>
  <meta name="description" content="TENET5 Autonomous Social Polarity Heuristics.">
  <meta name="theme-color" content="#050810">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F4CA;</text></svg>">
  <link rel="stylesheet" href="style.css?v=6">
  <style>
    .forecast-wrap { max-width: 1100px; margin: 0 auto; padding: 20px; font-family: 'JetBrains Mono', 'Courier New', monospace; color: var(--text-primary); }

    .forecast-header { text-align: center; padding: 30px 0 20px; border-bottom: 2px solid #10b981; margin-bottom: 30px; }
    .forecast-header h1 { font-family: 'Playfair Display', serif; font-size: 2.2rem; color: #10b981; letter-spacing: -1px; margin-bottom: 8px; }
    .forecast-header .subtitle { font-size: 0.85rem; color: var(--text-tertiary); }

    .sys-status { 
      background: rgba(16, 185, 129, 0.05); 
      border: 1px solid rgba(16, 185, 129, 0.3); 
      border-radius: 8px; 
      padding: 14px 20px; 
      margin-bottom: 24px; 
      font-size: 0.75rem; 
      color: #10b981; 
      text-transform: uppercase; 
      letter-spacing: 1.5px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .sys-status .label { color: var(--text-tertiary); }
    .sys-status .online { color: #10b981; font-weight: 700; animation: blink 2s infinite;}

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    .sentiment-list {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .sentiment-card {
        background: #0a0a0c;
        border-left: 4px solid #10b981;
        border-radius: 6px;
        padding: 20px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .s-head { display: flex; justify-content: space-between; align-items: flex-start; }
    .s-target { font-weight: bold; color: #fff; font-size: 1.1rem; font-family: 'Inter', sans-serif;}
    .s-polarity { font-size: 0.8rem; padding: 4px 10px; border-radius: 4px; font-weight: bold; }
    
    .pol-neg { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }
    .pol-pos { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981; }
    .pol-mix { background: rgba(245, 158, 11, 0.2); color: #f59e0b; border: 1px solid #f59e0b; }

    .s-bars { 
        display: flex; 
        gap: 15px; 
        font-size: 0.8rem; 
        background: rgba(255,255,255,0.03); 
        padding: 10px; 
        border-radius: 4px; 
    }
    .s-bars div { flex: 1; }
    .b-neg { color: #ef4444; }
    .b-pos { color: #10b981; }

    .s-snippet {
        font-size: 0.9rem;
        color: #c8c8ce;
        line-height: 1.5;
        border-left: 2px solid #333;
        padding-left: 10px;
        font-family: 'Inter', sans-serif;
    }

    .s-meta {
        font-size: 0.65rem;
        color: #666;
        display: flex;
        justify-content: space-between;
        margin-top: 5px;
    }
    .hash { color: #10b981; }

  </style>
</head>
<body>
  <div id="nav-placeholder"></div>

  <div class="forecast-wrap">
    <div class="forecast-header">
      <h1>Sentiment Matrix</h1>
      <div class="subtitle">Social Intelligence Polarity Array</div>
    </div>

    <div class="sys-status">
      <div><span class="label">Scanner Loop:</span> <span class="online">ACTIVE TICK (120s)</span></div>
      <div><span class="label">Data Source:</span> Target Entity Social Feeds</div>
      <div><span class="label">Polarized Nodes:</span> <span id="idx-count">0</span></div>
    </div>

    <div class="sentiment-list" id="sentiment-list">
        <div id="loader" style="padding:20px; color:#10b981; font-size:0.8rem; text-align:center;">SCANNING POLARITY...</div>
    </div>
  </div>

  <script src="nav.js?v=12"></script>
  <script>
    const tpTpl = buildNavHtml();
    document.getElementById('nav-placeholder').innerHTML = tpTpl;
    if(typeof attachNavEvents === 'function') attachNavEvents();

    async function fetchSentiment() {
        try {
            const response = await fetch('http://127.0.0.1:8091/api/sentiment');
            if(!response.ok) throw new Error('Daemon Offline');
            
            const payload = await response.json();
            
            if (payload && payload.status === "success") {
                const results = payload.data || [];
                document.getElementById('idx-count').innerText = results.length;
                renderList(results);
            }
        } catch(error) {
            console.error(error);
            document.getElementById('idx-count').innerText = "DISCONNECTED";
            document.getElementById('sentiment-list').innerHTML = `<div style="text-align:center; color:#ef4444; margin-top:40px; width:100%;">ERROR: STARK SENTIMENT BRIDGE OFFLINE. START UNIFIED DAEMON.</div>`;
        }
    }

    function renderList(results) {
        const listDiv = document.getElementById('sentiment-list');
        listDiv.innerHTML = "";

        if (results.length === 0) {
            listDiv.innerHTML = `<div style="color:#888; padding:20px; text-align:center; width: 100%;">No polarized resonance detected in social matrices.</div>`;
            return;
        }

        results.forEach((item) => {
            const timeStr = new Date(item.timestamp * 1000).toLocaleString();
            
            let pClass = "pol-mix";
            let bColor = "#f59e0b";
            if (item.polarity.includes("NEGATIVE")) { pClass = "pol-neg"; bColor = "#ef4444"; }
            if (item.polarity.includes("POSITIVE")) { pClass = "pol-pos"; bColor = "#10b981"; }
            
            const el = document.createElement('div');
            el.className = "sentiment-card";
            el.style.borderLeftColor = bColor;

            el.innerHTML = `
                <div class="s-head">
                    <div class="s-target">Entity Map: ${item.target_entity}</div>
                    <div class="s-polarity ${pClass}">${item.polarity.replace(/_/g, ' ')}</div>
                </div>
                
                <div class="s-bars">
                    <div class="b-neg">Negative Resonance [${item.neg_weight}]</div>
                    <div class="b-pos" style="text-align: right;">Positive Resonance [${item.pos_weight}]</div>
                </div>

                <div class="s-snippet">
                    "${item.text_snippet}"
                </div>

                <div class="s-meta">
                    <div class="hash">${item.crypto_signature}</div>
                    <div>${timeStr}</div>
                </div>
            `;
            listDiv.appendChild(el);
        });
    }

    fetchSentiment();
    setInterval(fetchSentiment, 15000); // Poll every 15s
  </script>
</body>
</html>
