  .wrap { max-width: 78ch; margin: 0 auto; }

  header.t-head { border-bottom: 2px solid var(--liril-rule-strong, var(--slate-border)); padding-bottom: 24px; margin-bottom: 32px; }

  .subtitle { color: var(--liril-muted); font-size: 1.05rem; margin: 0 0 16px; }

  .thesis { color: var(--liril-accent); font-size: 1.4rem; font-weight: 700; margin: 0; font-family: var(--liril-font-display, sans-serif); }

  .meta { display: flex; gap: 24px; margin-top: 18px; font-family: var(--liril-font-mono, monospace); font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--liril-muted); }

  .actions { margin-top: 24px; display: flex; gap: 12px; flex-wrap: wrap; }

  .btn { display: inline-block; padding: 8px 16px; border: 1px solid var(--liril-rule-strong, var(--slate-border)); color: var(--liril-fg); text-decoration: none; font-family: var(--liril-font-mono, monospace); font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; border-radius: 3px; }

  .btn--primary { background: var(--liril-accent); color: var(--liril-ink); border-color: var(--liril-accent); font-weight: 700; }

  .chapter { margin: 0 0 56px; padding: 24px 0 0; border-top: 1px solid var(--liril-rule, var(--slate-ink)); }

  .chapter:first-of-type { border-top: 0; }

  .chapter h2 { font-family: var(--liril-font-display, sans-serif); font-size: 1.6rem; margin: 0 0 8px; line-height: 1.25; }

  .chapter .num { font-family: var(--liril-font-mono, monospace); color: var(--liril-muted); font-size: 0.92rem; }

  .chapter .coord { font-family: var(--liril-font-mono, monospace); color: var(--liril-muted); font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 14px; }

  .overlay { font-family: var(--liril-font-display, sans-serif); color: var(--liril-accent); font-size: 1.4rem; font-weight: 800; margin: 12px 0 18px; letter-spacing: -0.01em; }

  .narration p { margin: 0 0 0.8em; font-size: 1.05rem; }

  .sources { margin-top: 16px; font-family: var(--liril-font-mono, monospace); font-size: 0.78rem; color: var(--liril-muted); }

  .sources a { color: var(--liril-link, var(--liril-accent)); }

  .toc { columns: 2; column-gap: 28px; margin: 0 0 48px; padding: 20px; background: var(--liril-elev-1, transparent); border: 1px solid var(--liril-rule, var(--slate-ink)); border-radius: 4px; }

  .toc ol { margin: 0; padding-left: 1.6em; }

  .toc a { color: var(--liril-fg); text-decoration: none; }

  .toc a:hover { color: var(--liril-accent); }

<script>
fetch('data/argument/manifest.json', { cache: 'no-store' })
  .then(function(r) { return r.json(); })
  .then(function(m) {
    document.getElementById('t-title').textContent = m._meta.title;
    document.getElementById('t-subtitle').textContent = m._meta.subtitle;
    document.getElementById('t-thesis').textContent = m._meta.thesis;
    document.getElementById('t-meta-c').textContent = m.chapters.length + ' chapters';
    document.getElementById('t-meta-d').textContent = Math.round(m._meta.total_seconds / 60) + ' minutes';
    document.getElementById('t-meta-v').textContent = 'v' + m._meta.version;

    var toc = document.getElementById('t-toc');
    var body = document.getElementById('t-body');
    m.chapters.forEach(function(ch) {
      var li = document.createElement('li');
      li.innerHTML = '<a href="#ch-' + ch.idx + '">' + ch.title + '</a>';
      toc.appendChild(li);

      var sec = document.createElement('article');
      sec.className = 'chapter';
      sec.id = 'ch-' + ch.idx;
      sec.innerHTML =
        '<div class="num">Chapter ' + ('00' + ch.idx).slice(-2) + ' of 25 · ' + Math.round(ch.dur / 60) + ' min</div>' +
        '<h2>' + ch.title + '</h2>' +
        '<div class="coord">grid coord [' + ch.coord[0] + ',' + ch.coord[1] + ']</div>' +
        '<div class="overlay">' + ch.overlay + '</div>' +
        '<div class="narration">' + ch.narration.map(function(line) { return '<p>' + line + '</p>'; }).join('') + '</div>' +
        '<div class="sources">Source: ' + ch.sources.map(function(s) {
          var url = /^(https?:|\/)/.test(s) ? s : (s + (/\.html?$/.test(s) ? '' : '/'));
          var label = s.split('/').filter(Boolean).pop() || s;
          return '<a href="' + url + '">' + label + '</a>';
        }).join(' · ') + '</div>';
      body.appendChild(sec);
    });

    // Cap#205: auto-print when arrived as evidence-packet request
    if (/[?&]print=1\b/.test(location.search)) {
      setTimeout(function () { try { window.print(); } catch (_) {} }, 350);
    }
  })
  .catch(function(err) {
    document.getElementById('t-body').innerHTML = '<p style="color:var(--liril-err)">Could not load manifest: ' + err + '</p>';
  });
</script>
