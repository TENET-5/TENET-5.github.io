<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Threat Intelligence | TENET5 OSINT</title>
  <meta name="description" content="TENET5 Threat Intelligence framework matrix. Tracking IOCs and network vectors.">
  <meta name="theme-color" content="#050810">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F6A8;</text></svg>">
  <link rel="stylesheet" href="style.css?v=6">
  <style>
    .dossier-wrap { max-width: 960px; margin: 0 auto; padding: 20px; font-family: 'JetBrains Mono', 'Courier New', monospace; color: var(--text-primary); }

    .dossier-header { text-align: center; padding: 40px 0 20px; border-bottom: 2px solid #ef4444; margin-bottom: 30px; }
    .dossier-header h1 { font-family: 'Playfair Display', serif; font-size: 2.2rem; color: var(--text-primary); letter-spacing: -1px; margin-bottom: 8px; }
    .dossier-header .subtitle { font-size: 0.85rem; color: var(--text-tertiary); }

    .sys-status { 
      background: rgba(10, 10, 15, 0.95); 
      border: 1px solid rgba(239, 68, 68, 0.25); 
      border-radius: 8px; 
      padding: 14px 20px; 
      margin-bottom: 24px; 
      font-size: 0.75rem; 
      color: #ef4444; 
      text-transform: uppercase; 
      letter-spacing: 1.5px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .sys-status .label { color: var(--text-tertiary); }
    .sys-status .online { color: #ef4444; font-weight: 700; }

    /* Search */
    .search-bar { width: 100%; padding: 12px; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(239, 68, 68, 0.3); color: #c8c8ce; border-radius: 8px; margin-bottom: 15px; font-family: inherit;}
    .search-bar:focus { outline: none; border-color: #ef4444; }
    
    .grid-container {
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 20px;
    }
    @media (max-width: 768px) { .grid-container { grid-template-columns: 1fr; } }
    
    .index-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-height: 600px;
        overflow-y: auto;
        padding-right: 5px;
    }
    .index-list::-webkit-scrollbar { width: 4px; }
    .index-list::-webkit-scrollbar-thumb { background: #ef4444; border-radius: 2px; }

    .index-item {
        background: var(--bg-card);
        border: 1px solid rgba(255, 255, 255, 0.05);
        padding: 15px;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.2s;
    }
    .index-item:hover, .index-item.active {
        border-color: #ef4444;
        background: #161618;
    }
    
    /* Level Tags */
    .level-low { background: #3b82f6; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 0.6rem; float: right; }
    .level-medium { background: #f59e0b; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 0.6rem; float: right; }
    .level-high { background: #f97316; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 0.6rem; float: right; }
    .level-critical { background: #ef4444; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 0.6rem; float: right; font-weight: bold; animation: pulse 2s infinite;}

    @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
        70% { box-shadow: 0 0 0 4px rgba(239, 68, 68, 0); }
        100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .index-item h4 { margin: 0 0 5px 0; font-size: 0.9rem; color: #fff;}
    .index-item .hash { font-size: 0.65rem; color: #ef4444; }
    
    .viewer {
        background: var(--bg-surface);
        border: 1px solid rgba(255,255,255,0.05);
        border-radius: 8px;
        padding: 30px;
        min-height: 500px;
        color: #c8c8ce;
        line-height: 1.6;
        font-size: 0.88rem;
    }
    .viewer h2 { color: #fff; font-size: 1.2rem; margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 10px; display:flex; justify-content: space-between; align-items: center;}
    .viewer .content { font-family: "Inter", sans-serif; background: rgba(0,0,0,0.3); padding: 20px; border-radius: 8px; font-size: 1rem; border-left: 3px solid #ef4444;}
    .viewer .indicator-box { margin-top: 20px; font-size: 0.75rem; color: #c8c8ce; background: #0a0a0c; padding: 15px; border-radius: 4px; border: 1px solid #333;}
    .viewer .indicator-row { display: flex; justify-content: space-between; margin-bottom: 8px; border-bottom:1px solid #222; padding-bottom: 8px;}
    .viewer .indicator-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  </style>

<!-- TENET5 SEO INJECT -->
  <meta property="og:title" content="Threat Intelligence | TENET5">
  <meta property="og:url" content="https://tenet-5.github.io/threat-intel.html">
  <meta property="og:type" content="website">
<!-- END SEO INJECT -->

</head>
<body>
  <div id="nav-placeholder"></div>

  <div class="dossier-wrap">
    <div class="dossier-header">
      <h1>Threat Intelligence</h1>
      <div class="subtitle">LIRIL Matrix Indicator Classification</div>
    </div>

    <div class="sys-status">
      <div><span class="label">Node:</span> LIRIL-THREAT-1</div>
      <div><span class="label">Connection:</span> <span class="online">ACTIVE</span></div>
      <div><span class="label">Total Reports:</span> <span id="idx-count">0</span></div>
    </div>

    <input type="text" class="search-bar" id="search" placeholder="Search by title, description, or IOC...">

    <div class="grid-container">
        <div class="index-list" id="index-list">
            <div id="loader" style="padding:20px; color:#ef4444; font-size:0.8rem; text-align:center;">CONNECTING TO LOCAL LIRIL NODE...</div>
        </div>

        <div class="viewer" id="viewer">
            <h2 id="v-title">No Report Selected</h2>
            <div class="content" id="v-content" style="display:none;"></div>
            <h3 style="margin-top:20px; color:#fff; display:none;" id="v-ind-header">Threat Indicators (IOC)</h3>
            <div class="indicator-box" id="v-indicators" style="display:none;"></div>
            <div id="v-placeholder" style="opacity:0.4; font-size:2rem; text-align:center; margin-top:20%">&#x1F6A8;</div>
        </div>
    </div>
  </div>

  <script src="nav.js?v=9"></script>
  <script>
    const tpTpl = buildNavHtml();
    document.getElementById('nav-placeholder').innerHTML = tpTpl;
    if(typeof attachNavEvents === 'function') attachNavEvents();

    let reports = [];

    async function fetchDiscoveries() {
        try {
            const response = await fetch('http://127.0.0.1:8091/api/threats');
            if(!response.ok) throw new Error('Daemon Offline');
            
            const payload = await response.json();
            
            if (payload && payload.status === "success") {
                document.getElementById('loader').style.display = 'none';
                reports = payload.data || [];
                renderList();
            }
        } catch(error) {
            console.error(error);
            document.getElementById('idx-count').innerText = "DISCONNECTED";
            document.getElementById('loader').innerText = "ERROR: LIRIL NODE DAEMON TARGET OFFLINE [HTTP 127.0.0.1:8091]. START THE DAEMON.";
        }
    }

    function renderList(filterTerm = "") {
        const listDiv = document.getElementById('index-list');
        listDiv.innerHTML = "";
        const term = filterTerm.toLowerCase();
        
        const filtered = reports.filter(d => 
            (d.title && d.title.toLowerCase().includes(term)) ||
            (d.description && d.description.toLowerCase().includes(term)) ||
            (JSON.stringify(d.indicators).toLowerCase().includes(term))
        );

        document.getElementById('idx-count').innerText = filtered.length;

        if (filtered.length === 0) {
            listDiv.innerHTML = `<div style="color:#888; padding:10px; font-size:0.8rem;">No threat reports match parameters.</div>`;
            return;
        }

        filtered.forEach((item) => {
            const timeStr = new Date(item.timestamp * 1000).toLocaleString();
            
            // Determine max threat level from indicators for badge
            let maxCls = 'level-low';
            let maxLvl = 'LOW';
            if(item.indicators && item.indicators.length > 0) {
                const lvls = item.indicators.map(i => i.threat_level);
                if(lvls.includes('CRITICAL')) { maxCls = 'level-critical'; maxLvl = 'CRITICAL'; }
                else if (lvls.includes('HIGH')) { maxCls = 'level-high'; maxLvl = 'HIGH'; }
                else if (lvls.includes('MEDIUM')) { maxCls = 'level-medium'; maxLvl = 'MEDIUM'; }
            }

            const el = document.createElement('div');
            el.className = "index-item";
            el.innerHTML = `
                <h4>${item.title.substring(0,25)}... <span class="${maxCls}">${maxLvl}</span></h4>
                <div class="hash">${item.crypto_signature.substring(0,24)}...</div>
                <div style="font-size: 0.7rem; color: #888; margin-top: 4px;">Detected: ${timeStr}</div>
            `;
            el.onclick = () => loadReport(item, el);
            listDiv.appendChild(el);
        });
    }

    function getLvlClass(lvl) {
        if(lvl === 'CRITICAL') return 'level-critical';
        if(lvl === 'HIGH') return 'level-high';
        if(lvl === 'MEDIUM') return 'level-medium';
        return 'level-low';
    }

    function loadReport(item, clickEl) {
        document.querySelectorAll('.index-item').forEach(e => e.classList.remove('active'));
        if (clickEl) clickEl.classList.add('active');

        document.getElementById('v-title').innerText = item.title;
        document.getElementById('v-content').innerText = item.description;
        
        let indStr = "";
        if (item.indicators && item.indicators.length > 0) {
            item.indicators.forEach(ind => {
                indStr += `
                <div class="indicator-row">
                    <div>
                        <strong style="color:white">${ind.name}</strong><br>
                        <span style="color:#888; font-size:0.65rem;">${ind.id}</span><br>
                        <span>${ind.description}</span>
                    </div>
                    <div><span class="${getLvlClass(ind.threat_level)}">${ind.threat_level}</span></div>
                </div>`;
            });
        } else {
            indStr = "No structured IOC indicators loaded.";
        }

        document.getElementById('v-indicators').innerHTML = indStr;
        
        document.getElementById('v-placeholder').style.display = 'none';
        document.getElementById('v-content').style.display = 'block';
        document.getElementById('v-ind-header').style.display = 'block';
        document.getElementById('v-indicators').style.display = 'block';
    }

    document.getElementById('search').addEventListener('input', (e) => renderList(e.target.value));

    fetchDiscoveries();
    setInterval(fetchDiscoveries, 5000);
  </script>
</body>
</html>
