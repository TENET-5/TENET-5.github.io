<!DOCTYPE html>
<html lang="en" data-theme="monochrome">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abracadabra | PRISM OS</title>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/tenet5.css?v=1">
  <link rel="stylesheet" href="css/liril-utilities.css">
  <link rel="stylesheet" href="css/abracadabra.css">
</head>
<body class="abracadabra-env">
  
  <div class="abra-container">
    <!-- Header / Status -->
    <header class="abra-header">
      <div class="abra-brand">
        <span class="sys-id">PRISM OS // ABRACADABRA</span>
        <h1 class="abra-title">I create as I speak.</h1>
      </div>
      <div class="abra-status">
        <span class="status-indicator"></span>
        <span id="liril-status-text">LIRIL: LISTENING</span>
      </div>
    </header>

    <!-- Main Generative Canvas -->
    <main class="abra-generative-canvas" id="gen-canvas">
      <div class="canvas-intro">
        <p>Awaiting voice initialization sequence.</p>
        <span class="pulse-line"></span>
      </div>
    </main>

    <!-- Transcription & Visualizer Footer -->
    <footer class="abra-footer">
      <div class="transcription-layer">
        <span class="prompt-carat">&gt;</span>
        <div id="transcription-text" class="typewriter">Speak to materialize...</div>
      </div>
      <div class="visualizer-container">
        <canvas id="audio-visualizer"></canvas>
      </div>
      
      <!-- Debug Controls for Simulation -->
      <div class="abra-debug">
        <button id="sim-speak" class="cta secondary">SIMULATE VOICE</button>
        <button id="sim-generate" class="cta">GENERATE ARTIFACT</button>
      </div>
    </footer>
  </div>

  <script src="js/abracadabra-core.js"></script>
</body>
</html>
