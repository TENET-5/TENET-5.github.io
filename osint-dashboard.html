<!DOCTYPE html>
<html lang="en-CA">
<head>
  <script>
    if (window === window.top && window.location.pathname.indexOf("index.html") === -1) {
        window.location.replace("index.html?load=" + window.location.pathname.split("/").pop());
    }
    if (window !== window.top) {
      document.addEventListener('DOMContentLoaded', function() {
        document.body.classList.add('in-shell');
      });
    }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TENET5 OSINT Intelligence Dashboard</title>
  <link rel="stylesheet" href="style.css?v=22">
  <link rel="stylesheet" href="css/liril-theme.css?v=1">
  <link rel="stylesheet" href="css/osint-dashboard.css?v=1">
</head>
<body class="topo liril-dashboard">

<header class="liril-masthead liril-glass">
  <nav class="liril-nav">
    <div class="logo">TENET5<span class="tag">OSINT OPERATIONS</span></div>
    <ul>
      <li><a href="home.html">Newsroom</a></li>
      <li><a href="#anomalies">Anomalies</a></li>
      <li><a href="#network">Network Graph</a></li>
      <li><a href="evidence-index.html">Evidence Vault</a></li>
      <li><a href="accountability.html">Accountability</a></li>
    </ul>
    <div class="right">
      <div class="threat-indicator" id="global-threat-level">
        <div class="threat-dot"></div>
        <span class="threat-text">THREAT: AMBER</span>
      </div>
      <div class="ai-staff-chip">LIRIL · Nemotron-9B</div>
    </div>
  </nav>
</header>

<main class="dashboard-main">
  <!-- Top Metrics Strip -->
  <section class="metrics-strip" id="metrics-container">
    <!-- Populated by JS -->
    <div class="metric-skeleton"></div>
    <div class="metric-skeleton"></div>
    <div class="metric-skeleton"></div>
    <div class="metric-skeleton"></div>
  </section>

  <div class="dashboard-grid">
    <!-- Left Column: Daily Brief & Anomalies -->
    <div class="dashboard-col-main">
      <div class="dashboard-card glass-card prime-brief">
        <h2 class="card-title">
          <span class="pulse-icon"></span>
          Daily Intelligence Brief
          <span class="timestamp" id="brief-timestamp">Loading...</span>
        </h2>
        <div class="brief-content" id="brief-content">
          <div class="text-skeleton" style="width:100%;height:14px;margin-bottom:8px"></div>
          <div class="text-skeleton" style="width:90%;height:14px;margin-bottom:8px"></div>
          <div class="text-skeleton" style="width:95%;height:14px;margin-bottom:8px"></div>
          <br>
          <div class="text-skeleton" style="width:100%;height:14px;margin-bottom:8px"></div>
          <div class="text-skeleton" style="width:85%;height:14px;margin-bottom:8px"></div>
        </div>
      </div>

      <div class="dashboard-card glass-card" id="anomalies">
        <h2 class="card-title">Procurement Anomalies</h2>
        <div class="anomalies-feed" id="anomalies-feed">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>

    <!-- Right Column: Network & Findings -->
    <div class="dashboard-col-side">
      <div class="dashboard-card glass-card" id="network">
        <h2 class="card-title">Entity Network</h2>
        <div class="network-minimap" id="network-canvas-container">
          <!-- Canvas for entity network visualization -->
          <canvas id="network-canvas" width="400" height="300"></canvas>
          <div class="network-overlay-text" id="network-overlay">Initializing topology...</div>
        </div>
        <div class="card-footer">
          <a href="network-analysis.html" class="action-link">Open Full Graph →</a>
        </div>
      </div>

      <div class="dashboard-card glass-card recent-reports">
        <h2 class="card-title">Latest Intelligence Reports</h2>
        <ul class="report-list" id="report-list">
          <!-- Populated by JS -->
        </ul>
      </div>
    </div>
  </div>
</main>

<script src="js/osint-dashboard.js?v=1"></script>
</body>
</html>
