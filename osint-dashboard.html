<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIRIL Tactical Dashboard | TENET5</title>
  <meta name="theme-color" content="#0a0a0c">
  <link rel="stylesheet" href="style.css?v=6">
  <style>
    body { background-color: #050508; color: #c8c8ce; font-family: 'JetBrains Mono', monospace; margin: 0; padding: 0; }
    #dash-container { max-width: 1400px; margin: 0 auto; padding: 20px; display: grid; gap: 20px; grid-template-columns: 350px 1fr; height: 95vh; }
    
    .panel { background: rgba(10, 15, 25, 0.9); border: 1px solid rgba(57, 255, 20, 0.15); border-radius: 8px; padding: 20px; overflow-y: auto; position: relative; }
    .panel::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); }
    
    h2 { font-size: 0.9rem; color: #39ff14; text-transform: uppercase; margin-top: 0; letter-spacing: 2px; }
    
    /* Live Telemetry Feed */
    .telemetry-feed { display: flex; flex-direction: column; gap: 10px; }
    .telemetry-card { 
      background: #0f121a; border-left: 3px solid rgba(255, 50, 80, 0.6); 
      padding: 12px; border-radius: 4px; font-size: 0.8rem;
      transition: background 0.2s, border-left 0.2s;
    }
    .telemetry-card:hover { background: #161a26; border-left: 3px solid #ff3250; cursor: pointer; }
    .telemetry-card.active { border-left: 3px solid #39ff14; background: rgba(57, 255, 20, 0.05); }
    
    .vector-label { color: var(--text-tertiary); font-size: 0.7rem; }
    .vector-value { color: #ff3250; font-weight: bold; letter-spacing: 1px; }
    
    /* Main Viewer */
    .viewer { background: #000; border: 1px solid #1a1f36; font-family: 'Courier New', Courier, monospace; position: relative; }
    .viewer pre { white-space: pre-wrap; font-size: 0.85rem; color: #60a5fa; padding: 20px; margin: 0; }
    
    .status-bar {
      grid-column: 1 / -1; background: #0a0f18; display: flex; justify-content: space-between; padding: 10px 20px;
      border: 1px solid rgba(57,255,20,0.2); font-size: 0.8rem; border-radius: 4px;
    }
    .status-indicator { display: inline-block; width: 8px; height: 8px; background: #39ff14; border-radius: 50%; box-shadow: 0 0 10px #39ff14; margin-right: 8px; animation: blink 2s infinite; }
    
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    @keyframes scrollBg { from { background-position: 0 0; } to { background-position: 0 1000px; } }
    
    .matrix-overlay {
      position: absolute; top:0; left:0; width:100%; height:100%; pointer-events: none; opacity: 0.05;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, #39ff14 2px, #39ff14 4px);
      z-index: 10;
    }

    #loading { color: #39ff14; text-align: center; margin-top: 50px; font-size: 1.2rem; }
  </style>
</head>
<body>
  
  <nav id="site-nav"></nav>

  <div id="dash-container">
    <div class="panel">
      <h2>&#128225; LIVE TELEMETRY</h2>
      <div id="loading">Establishing SAT-COM Link...</div>
      <div class="telemetry-feed" id="feed-container">
        <!-- Javascript renders feed here -->
      </div>
    </div>
    
    <div class="panel viewer">
      <h2>&#9881; LIRIL TOPOLOGICAL DECRYPTION</h2>
      <div class="matrix-overlay"></div>
      <pre id="json-viewer">Awaiting target selection...</pre>
    </div>
    
    <div class="status-bar">
      <div><span class="status-indicator"></span><strong>QUAD HUB:</strong> NATS CONNECTED (127.0.0.1:8091)</div>
      <div><strong>LIRIL ENGINE:</strong> ACTIVE</div>
    </div>
  </div>

  <script src="js/x-ai-glow.js"></script>
  <script src="nav.js"></script>
  <script>
    let currentFeed = [];
    
    function formatTime(timestamp) {
      if(!timestamp) return 'UNKNOWN';
      const d = new Date(timestamp * 1000);
      return d.toLocaleTimeString() + '.' + d.getMilliseconds().toString().padStart(3, '0');
    }

    function renderFeed(data) {
      const container = document.getElementById('feed-container');
      const loader = document.getElementById('loading');
      if(loader) loader.style.display = 'none';
      
      container.innerHTML = '';
      data.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'telemetry-card x-glow-target';
        
        let type = "UNKNOWN_PKT";
        if(item.discovery_value && item.discovery_value.event) {
          type = item.discovery_value.event.toUpperCase();
        }
        
        const sig = item.crypto_signature || 'UNVERIFIED';
        const vec = (item.discovery_value && item.discovery_value.topological_vector) ? item.discovery_value.topological_vector : 'ENCRYPTED';
        
        card.innerHTML = \`
          <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
            <strong style="color:#fff;">\${type}</strong>
            <span style="color:#888;">\${formatTime(item.timestamp)}</span>
          </div>
          <div class="vector-label">VECTOR: <span class="vector-value">\${vec}</span></div>
          <div class="vector-label" style="margin-top:4px;">SIG: <span style="color:#39ff14;">\${sig}</span></div>
        \`;
        
        card.onclick = () => {
          document.querySelectorAll('.telemetry-card').forEach(c => c.classList.remove('active'));
          card.classList.add('active');
          document.getElementById('json-viewer').textContent = JSON.stringify(item.discovery_value, null, 2);
        };
        
        container.appendChild(card);
      });
      
      // Auto select first
      if(data.length > 0 && document.getElementById('json-viewer').textContent === 'Awaiting target selection...') {
        container.children[0].click();
      }
    }

    async function fetchTelemetry() {
      try {
        const res = await fetch('http://127.0.0.1:8091/api/discoveries');
        if(!res.ok) throw new Error('API offline');
        const json = await res.json();
        
        // Deep compare to avoid re-rendering constantly if unchanged
        if(JSON.stringify(json.data) !== JSON.stringify(currentFeed)) {
          currentFeed = json.data;
          renderFeed(currentFeed);
        }
      } catch(err) {
        console.error("SAT-COM link failed. Retrying...", err);
        const loader = document.getElementById('loading');
        if(loader && loader.style.display !== 'none') {
            loader.innerHTML = '<span style="color:#ff3250">SAT-COM OFFLINE. AWAITING CONNECTION...</span>';
        }
      }
    }

    // Poll every 2 seconds
    setInterval(fetchTelemetry, 2000);
    fetchTelemetry();
  </script>
</body>
</html>
