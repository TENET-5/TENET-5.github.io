  <style>
    .dash-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      color: var(--text-primary);
    }
    .dash-header {
      text-align: center;
      padding: 40px 0 20px;
      border-bottom: 2px solid rgba(196, 30, 58, 0.4);
      margin-bottom: 30px;
    }
    .dash-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.4rem;
      color: var(--text-primary);
      letter-spacing: -1px;
      margin-bottom: 8px;
    }
    .dash-header .subtitle {
      font-size: 0.85rem;
      color: var(--text-tertiary);
    }
    .dash-header .big-amount {
      font-size: 2.8rem;
      font-weight: 800;
      color: var(--accent);
      margin: 16px 0 4px;
      letter-spacing: -1px;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      transition: border-color 0.2s;
    }
    .stat-card:hover { border-color: rgba(196, 30, 58, 0.3); }
    .stat-card .stat-number {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text-primary);
      display: block;
    }
    .stat-card .stat-label {
      font-size: 0.72rem;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 4px;
    }

    .section-block {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .section-block h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      color: var(--text-primary);
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(196, 30, 58, 0.2);
    }

    /* Party Bars */
    .party-bar-chart {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .party-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .party-name {
      width: 180px;
      min-width: 120px;
      font-size: 0.82rem;
      color: var(--text-primary);
      font-weight: 600;
      text-align: right;
      flex-shrink: 0;
    }
    .party-track {
      flex: 1;
      height: 32px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
    }
    .party-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 1s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      padding-left: 10px;
      font-size: 0.72rem;
      font-weight: 700;
      color: rgba(255,255,255,0.9);
    }
    .party-amount {
      width: 100px;
      font-size: 0.78rem;
      color: var(--text-tertiary);
      text-align: right;
      flex-shrink: 0;
      font-weight: 600;
    }

    /* Pie Indicator */
    .pie-section {
      display: flex;
      align-items: center;
      gap: 30px;
      flex-wrap: wrap;
    }
    .pie-ring {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      position: relative;
      flex-shrink: 0;
    }
    .pie-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
    .pie-center .pie-pct {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--text-primary);
      display: block;
    }
    .pie-center .pie-label {
      font-size: 0.65rem;
      color: var(--text-tertiary);
      text-transform: uppercase;
    }
    .pie-legend {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .pie-legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
    }
    .pie-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Data Table */
    .data-table-wrap { overflow-x: auto; }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    .data-table th {
      background: var(--bg-card-h);
      color: var(--text-tertiary);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 10px 12px;
      text-align: left;
      border-bottom: 2px solid rgba(196, 30, 58, 0.3);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    .data-table th:hover { color: var(--text-primary); background: #1a1a1c; }
    .data-table th .sort-arrow { margin-left: 4px; opacity: 0.4; }
    .data-table th.sorted .sort-arrow { opacity: 1; color: #c41e3a; }
    .data-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      color: #c8c8cc;
    }
    .data-table tbody tr:hover { background: rgba(196, 30, 58, 0.05); }
    .data-table .rank-col { color: var(--text-tertiary); width: 40px; text-align: center; }
    .data-table .num-col { text-align: right; font-weight: 600; color: var(--text-primary); }

    /* Year Chart (SVG line) */
    .year-chart-wrap {
      width: 100%;
      overflow-x: auto;
    }
    .year-chart-wrap svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .disclaimer {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 6px;
      padding: 14px 18px;
      font-size: 0.75rem;
      color: var(--text-tertiary);
      line-height: 1.7;
      margin-top: 12px;
    }

    .source-footer {
      text-align: center;
      padding: 40px 20px;
      border-top: 1px solid var(--border);
      margin-top: 40px;
    }
    .source-footer p {
      font-size: 0.75rem;
      color: var(--text-tertiary);
      line-height: 1.8;
    }
    .source-footer a {
      color: var(--text-tertiary);
      text-decoration: underline;
      text-decoration-color: rgba(160,160,166,0.3);
    }
    .source-footer a:hover { color: var(--accent); }

    .loading {
      text-align: center;
      padding: 60px;
      color: var(--text-tertiary);
      font-size: 0.85rem;
    }
    .loading::after {
      content: '';
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-top-color: #c41e3a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-left: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 700px) {
      .party-name { width: 100px; min-width: 80px; font-size: 0.72rem; }
      .party-amount { width: 70px; font-size: 0.7rem; }
      .stats-row { grid-template-columns: 1fr 1fr; }
      .dash-header h1 { font-size: 1.6rem; }
      .dash-header .big-amount { font-size: 1.8rem; }
      .pie-section { justify-content: center; }
    }
  </style>

  <div id="main" class="dash-wrap">
    <div class="dash-header">
      <h1>Who's Funding Canadian Politics</h1>

<script>
  (function() {
    'use strict';

    fetch('data/contributions_analysis.json')
      .then(function(r) { return r.json(); })
      .then(function(data) { renderAll(data); })
      .catch(function(err) {
        document.getElementById('content-area').innerHTML =
          '<p class="tnt-style-59">Failed to load data: ' + err.message + '</p>';
      });

    function fmt(n) { return Number(n).toLocaleString('en-CA'); }
    function fmtM(n) { return '$' + (n / 1e6).toFixed(0) + 'M'; }
    function fmtDollar(n) { return '$' + Number(n).toLocaleString('en-CA', {minimumFractionDigits: 0, maximumFractionDigits: 0}); }

    var PARTY_COLORS = {
      'Conservative Party of Canada': '#1a4b8c',
      'Liberal Party of Canada': '#d71920',
      'New Democratic Party': '#f58220',
      'Green Party of Canada': '#3d9b35',
      'Bloc Qu\u00e9b\u00e9cois': '#33b2cc',
      'People\'s Party of Canada': '#6b3fa0',
      'Christian Heritage Party of Canada': '#6e4b3a',
      'Animal Protection Party of Canada': '#2f8c5c',
      'Communist Party of Canada': '#cc0000',
      'Marxist-Leninist Party of Canada': '#990000'
    };

    function getColor(party) {
      return PARTY_COLORS[party] || '#555';
    }

    function renderAll(data) {
      var el = document.getElementById('content-area');
      el.className = '';
      var html = '';

      // ── Stats Row ──
      var totalAmount = 0;
      data.party_donations.forEach(function(p) { totalAmount += p.total_amount; });
      html += '<div class="stats-row">';
      html += '<div class="stat-card"><span class="stat-number">' + fmt(data.total_records) + '</span><span class="stat-label">Total Contributions</span></div>';
      html += '<div class="stat-card"><span class="stat-number">' + fmtDollar(totalAmount) + '</span><span class="stat-label">Total Amount</span></div>';
      html += '<div class="stat-card"><span class="stat-number">' + data.party_donations.length + '</span><span class="stat-label">Parties</span></div>';
      html += '<div class="stat-card"><span class="stat-number">' + data.by_year.length + '</span><span class="stat-label">Years of Data</span></div>';
      html += '</div>';

      // ── Party Funding Comparison ──
      html += '<div class="section-block">';
      html += '<h2>Party Funding Comparison</h2>';
      html += '<div class="disclaimer tnt-style-388">Total contributions by party since 2004. All contributions are legal and publicly disclosed.</div>';
      html += renderPartyBars(data.party_donations.slice(0, 7));
      html += '</div>';

      // ── Contribution Types ──
      html += '<div class="section-block">';
      html += '<h2>Contribution Types</h2>';
      html += renderContribTypes(data.contributor_types);
      html += '<div class="disclaimer">Corporate donations to federal parties have been banned since 2007. Historical corporate donations are from the pre-ban period.</div>';
      html += '</div>';

      // ── Top 50 Donors ──
      html += '<div class="section-block">';
      html += '<h2>Top Donors (Cumulative)</h2>';
      html += '<div class="disclaimer tnt-style-388">Cumulative donation totals over all available years. Aggregate categories like "Contributions of $200 or less" group many small donors. All donations are legal and publicly reported to Elections Canada.</div>';
      html += renderDonorTable(data.top_donors);
      html += '</div>';

      // ── Yearly Trends ──
      html += '<div class="section-block">';
      html += '<h2>Yearly Contribution Trends</h2>';
      html += '<p class="tnt-style-389">Number of individual contributions by year. Election years typically show spikes.</p>';
      html += renderYearChart(data.by_year);
      html += '</div>';

      // ── Top 50 Recipients ──
      html += '<div class="section-block">';
      html += '<h2>Top Recipients (by donation count)</h2>';
      html += '<div class="disclaimer tnt-style-388">Ranked by number of individual donations received, not dollar amount. Includes party organizations and leadership candidates.</div>';
      html += renderRecipientTable(data.top_recipients);
      html += '</div>';

      // ── Source Footer ──
      html += '<div class="source-footer">';
      html += '<p><a href="https://www.elections.ca/content.aspx?section=fin&dir=oda&document=index&lang=e" target="_blank" rel="noopener">Elections Canada Open Data</a>. All contributions are legal and publicly disclosed.</p>';
      html += '<p>Corporate donations to federal parties have been banned since 2007.</p>';
      html += '<p class="tnt-style-17">Data sourced from public government records.</p>';
      html += '</div>';

      el.innerHTML = html;

      requestAnimationFrame(function() {
        el.querySelectorAll('.party-fill').forEach(function(bar) {
          bar.style.width = bar.dataset.width + '%';
        });
      });

      el.querySelectorAll('.data-table').forEach(function(table) {
        setupTableSort(table);
      });
    }

    function renderPartyBars(parties) {
      var max = parties[0].total_amount;
      var h = '<div class="party-bar-chart">';
      for (var i = 0; i < parties.length; i++) {
        var p = parties[i];
        var pct = (p.total_amount / max * 100).toFixed(1);
        var color = getColor(p.party);
        h += '<div class="party-row">';
        h += '<span class="party-name">' + escHtml(p.party.replace(' of Canada', '').replace(' Party', ' P.')) + '</span>';
        h += '<div class="party-track"><div class="party-fill tnt-style-390" data-width="' + pct + '">' + fmt(p.count) + ' donations</div></div>';
        h += '<span class="party-amount">' + fmtM(p.total_amount) + '</span>';
        h += '</div>';
      }
      h += '</div>';
      return h;
    }

    function renderContribTypes(types) {
      var total = 0;
      types.forEach(function(t) { total += t.count; });
      var indivPct = (types[0].count / total * 100).toFixed(1);
      var otherPct = (100 - parseFloat(indivPct)).toFixed(1);

      var h = '<div class="pie-section">';

      // CSS conic gradient pie
      h += '<div class="pie-ring tnt-style-391">';
      h += '<div class="pie-center tnt-style-392">';
      h += '<span class="pie-pct">' + indivPct + '%</span>';
      h += '<span class="pie-label">Individual</span>';
      h += '</div></div>';

      h += '<div class="pie-legend">';
      for (var i = 0; i < types.length; i++) {
        var pct = (types[i].count / total * 100);
        var pctStr = pct < 0.1 ? '<0.1%' : pct.toFixed(1) + '%';
        var color = i === 0 ? '#2d7dd2' : '#c41e3a';
        h += '<div class="pie-legend-item">';
        h += '<span class="pie-dot tnt-style-393"></span>';
        h += '<span class="tnt-style-394">' + escHtml(types[i].type) + ': ' + fmt(types[i].count) + ' (' + pctStr + ')</span>';
        h += '</div>';
      }
      h += '</div></div>';
      return h;
    }

    function renderDonorTable(donors) {
      var h = '<div class="data-table-wrap"><table class="data-table" data-sortable>';
      h += '<thead><tr>';
      h += '<th class="rank-col">#</th>';
      h += '<th data-sort="string">Name <span class="sort-arrow">&#9650;</span></th>';
      h += '<th data-sort="number" class="sorted">Total Amount <span class="sort-arrow">&#9660;</span></th>';
      h += '</tr></thead><tbody>';
      for (var i = 0; i < donors.length; i++) {
        h += '<tr>';
        h += '<td class="rank-col">' + (i + 1) + '</td>';
        h += '<td>' + escHtml(donors[i].name) + '</td>';
        h += '<td class="num-col">' + fmtDollar(donors[i].total_amount) + '</td>';
        h += '</tr>';
      }
      h += '</tbody></table></div>';
      return h;
    }

    function renderRecipientTable(recipients) {
      var h = '<div class="data-table-wrap"><table class="data-table" data-sortable>';
      h += '<thead><tr>';
      h += '<th class="rank-col">#</th>';
      h += '<th data-sort="string">Recipient <span class="sort-arrow">&#9650;</span></th>';
      h += '<th data-sort="number" class="sorted">Donations Received <span class="sort-arrow">&#9660;</span></th>';
      h += '</tr></thead><tbody>';
      for (var i = 0; i < recipients.length; i++) {
        h += '<tr>';
        h += '<td class="rank-col">' + (i + 1) + '</td>';
        h += '<td>' + escHtml(recipients[i].name) + '</td>';
        h += '<td class="num-col">' + fmt(recipients[i].donations_received) + '</td>';
        h += '</tr>';
      }
      h += '</tbody></table></div>';
      return h;
    }

    function renderYearChart(byYear) {
      // Filter out years with very low counts (likely partial data)
      var years = byYear.filter(function(y) { return y.count > 5000; });
      if (years.length === 0) years = byYear;

      var maxCount = 0;
      years.forEach(function(y) { if (y.count > maxCount) maxCount = y.count; });

      var w = 900;
      var h = 300;
      var padL = 70;
      var padR = 20;
      var padT = 20;
      var padB = 50;
      var chartW = w - padL - padR;
      var chartH = h - padT - padB;

      var svg = '<div class="year-chart-wrap"><svg viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg">';

      // Grid lines
      for (var g = 0; g <= 4; g++) {
        var gy = padT + (chartH / 4) * g;
        var gVal = maxCount - (maxCount / 4) * g;
        svg += '<line x1="' + padL + '" y1="' + gy + '" x2="' + (w - padR) + '" y2="' + gy + '" stroke="var(--border)" />';
        svg += '<text x="' + (padL - 8) + '" y="' + (gy + 4) + '" fill="#6e6e76" font-size="10" text-anchor="end" font-family="JetBrains Mono, monospace">' + (gVal / 1000).toFixed(0) + 'K</text>';
      }

      // Build path
      var points = [];
      var dots = '';
      for (var i = 0; i < years.length; i++) {
        var x = padL + (chartW / (years.length - 1)) * i;
        var y = padT + chartH - (years[i].count / maxCount * chartH);
        points.push(x.toFixed(1) + ',' + y.toFixed(1));
        dots += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="3.5" fill="#c41e3a" stroke="var(--bg-surface)" stroke-width="1.5" />';

        // Year label
        if (i % 2 === 0 || years.length < 12) {
          svg += '<text x="' + x.toFixed(1) + '" y="' + (h - 10) + '" fill="#6e6e76" font-size="10" text-anchor="middle" font-family="JetBrains Mono, monospace">' + years[i].year + '</text>';
        }
      }

      // Area fill
      svg += '<polygon points="' + padL + ',' + (padT + chartH) + ' ' + points.join(' ') + ' ' + (padL + chartW) + ',' + (padT + chartH) + '" fill="url(#areaGrad)" />';
      svg += '<defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(196,30,58,0.3)" /><stop offset="100%" stop-color="rgba(196,30,58,0)" /></linearGradient></defs>';

      // Line
      svg += '<polyline points="' + points.join(' ') + '" fill="none" stroke="#c41e3a" stroke-width="2" stroke-linejoin="round" />';
      svg += dots;
      svg += '</svg></div>';
      return svg;
    }

    function setupTableSort(table) {
      var headers = table.querySelectorAll('th[data-sort]');
      headers.forEach(function(th, colIndex) {
        var actualCol = colIndex + 1;
        th.addEventListener('click', function() {
          var type = th.dataset.sort;
          var tbody = table.querySelector('tbody');
          var rows = Array.from(tbody.querySelectorAll('tr'));
          var asc = th.classList.contains('sorted-asc');

          headers.forEach(function(h) {
            h.classList.remove('sorted', 'sorted-asc', 'sorted-desc');
            h.querySelector('.sort-arrow').textContent = '\u25B2';
          });

          rows.sort(function(a, b) {
            var aVal = a.children[actualCol].textContent.trim();
            var bVal = b.children[actualCol].textContent.trim();
            if (type === 'number') {
              aVal = parseFloat(aVal.replace(/[$,]/g, '')) || 0;
              bVal = parseFloat(bVal.replace(/[$,]/g, '')) || 0;
            }
            if (asc) {
              return aVal > bVal ? -1 : aVal < bVal ? 1 : 0;
            } else {
              return aVal > bVal ? 1 : aVal < bVal ? -1 : 0;
            }
          });

          rows.forEach(function(row, i) {
            row.children[0].textContent = i + 1;
            tbody.appendChild(row);
          });

          th.classList.add('sorted');
          if (asc) {
            th.classList.add('sorted-desc');
            th.querySelector('.sort-arrow').textContent = '\u25BC';
          } else {
            th.classList.add('sorted-asc');
            th.querySelector('.sort-arrow').textContent = '\u25B2';
          }
        });
      });
    }

    function escHtml(s) {
      var d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }
  })();
  </script>
