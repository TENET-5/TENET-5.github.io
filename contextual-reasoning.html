<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contextual Reasoning | TENET5 Matrix</title>
  <meta name="description" content="TENET5 Logical Deduction Inference Engine.">
  <meta name="theme-color" content="#050810">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F9E0;</text></svg>">
  <link rel="stylesheet" href="style.css?v=6">
  <style>
    .cr-wrap { max-width: 1000px; margin: 0 auto; padding: 20px; font-family: 'JetBrains Mono', 'Courier New', monospace; color: var(--text-primary); }

    .cr-header { text-align: center; padding: 30px 0 20px; border-bottom: 2px solid #ef4444; margin-bottom: 30px; }
    .cr-header h1 { font-family: 'Playfair Display', serif; font-size: 2.2rem; color: #ef4444; letter-spacing: -1px; margin-bottom: 8px; }
    .cr-header .subtitle { font-size: 0.85rem; color: var(--text-tertiary); }

    .sys-status { 
      background: rgba(239, 68, 68, 0.05); 
      border: 1px solid rgba(239, 68, 68, 0.3); 
      border-radius: 8px; 
      padding: 14px 20px; 
      margin-bottom: 24px; 
      font-size: 0.75rem; 
      color: #ef4444; 
      text-transform: uppercase; 
      letter-spacing: 1.5px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .sys-status .label { color: var(--text-tertiary); }
    .sys-status .online { color: #ef4444; font-weight: 700; animation: blink 2s infinite;}

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    .reasoning-list {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .reasoning-card {
        background: #0a0a0c;
        border: 1px solid #222;
        border-left: 5px solid #ef4444;
        border-radius: 6px;
        padding: 20px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        display: flex;
        flex-direction: column;
        gap: 12px;
        transition: transform 0.2s, border-color 0.2s;
    }
    
    .reasoning-card:hover {
        transform: translateX(2px);
        border-color: #ef4444;
    }
    
    .reasoning-card.routine {
        border-left-color: #3b82f6;
    }
    .reasoning-card.routine:hover { border-color: #3b82f6; }

    .r-header-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #222;
        padding-bottom: 10px;
    }

    .r-target {
        font-family: 'Inter', sans-serif;
        font-weight: 800;
        font-size: 1.2rem;
        color: #fff;
    }

    .r-conf {
        font-size: 0.9rem;
        font-weight: bold;
    }
    .high-conf { color: #ef4444; }
    .med-conf { color: #f59e0b; }
    .low-conf { color: #3b82f6; }
    
    .r-logic {
        font-size: 1.1rem;
        color: #f1f1f1;
        background: rgba(255,255,255,0.03);
        padding: 15px;
        border-radius: 4px;
        font-family: 'Inter', sans-serif;
        line-height: 1.4;
    }
    
    .r-evidence {
        font-size: 0.85rem;
        color: #aaa;
        font-style: italic;
    }

    .r-meta {
        font-size: 0.65rem;
        color: #555;
        display: flex;
        justify-content: space-between;
    }
    .r-hash { color: #ef4444; font-family: monospace; }
    .routine .r-hash { color: #3b82f6; }

  </style>
</head>
<body>
  <div id="nav-placeholder"></div>

  <div class="cr-wrap">
    <div class="cr-header">
      <h1>Contextual Reasoning</h1>
      <div class="subtitle">Heuristic Multi-Node Logic Engine Deductions</div>
    </div>

    <div class="sys-status">
      <div><span class="label">Inference Matrix:</span> <span class="online">ACTIVE TICK (900s)</span></div>
      <div><span class="label">Logic Source:</span> Graph + Sentiment Poll</div>
      <div><span class="label">Deductions Logged:</span> <span id="idx-count">0</span></div>
    </div>

    <div class="reasoning-list" id="reasoning-list">
        <div id="loader" style="padding:20px; color:#ef4444; font-size:0.8rem; text-align:center;">GENERATING LOGICAL INFERENCES...</div>
    </div>
  </div>

  <script src="nav.js?v=14"></script>
  <script>
    const tpTpl = buildNavHtml();
    document.getElementById('nav-placeholder').innerHTML = tpTpl;
    if(typeof attachNavEvents === 'function') attachNavEvents();

    async function fetchReasoning() {
        try {
            const response = await fetch('http://127.0.0.1:8091/api/reasoning');
            if(!response.ok) throw new Error('Daemon Offline');
            
            const payload = await response.json();
            
            if (payload && payload.status === "success") {
                const results = payload.data || [];
                document.getElementById('idx-count').innerText = results.length;
                renderList(results);
            }
        } catch(error) {
            console.error(error);
            document.getElementById('idx-count').innerText = "DISCONNECTED";
            document.getElementById('reasoning-list').innerHTML = `<div style="text-align:center; color:#ef4444; margin-top:40px;">ERROR: STARK INFERENCE ENGINE OFFLINE. START UNIFIED DAEMON.</div>`;
        }
    }

    function renderList(results) {
        const listDiv = document.getElementById('reasoning-list');
        listDiv.innerHTML = "";

        if (results.length === 0) {
            listDiv.innerHTML = `<div style="color:#888; padding:20px; text-align:center;">No cross-correlations detected demanding logical deduction.</div>`;
            return;
        }

        results.forEach((item) => {
            const timeStr = new Date(item.timestamp * 1000).toLocaleString();
            
            const el = document.createElement('div');
            const isRoutine = item.logical_deduction.includes("Routine");
            el.className = `reasoning-card ${isRoutine ? 'routine' : ''}`;

            let confClass = 'low-conf';
            if (item.confidence_score >= 90) confClass = 'high-conf';
            else if (item.confidence_score >= 70) confClass = 'med-conf';

            el.innerHTML = `
                <div class="r-header-row">
                    <div class="r-target">${item.target_entity}</div>
                    <div class="r-conf ${confClass}">Conf: ${item.confidence_score.toFixed(1)}%</div>
                </div>

                <div class="r-logic">
                    ${item.logical_deduction}
                </div>

                <div class="r-evidence">
                    Evidence Link: ${item.supporting_evidence}
                </div>

                <div class="r-meta">
                    <div class="r-hash">${item.crypto_signature}</div>
                    <div>${timeStr}</div>
                </div>
            `;
            listDiv.appendChild(el);
        });
    }

    fetchReasoning();
    setInterval(fetchReasoning, 15000); // Poll every 15s
  </script>
</body>
</html>
