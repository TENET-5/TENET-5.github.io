<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entity Registry | TENET5 Disambiguation</title>
  <meta name="description" content="TENET5 Formal Entity Resolution Table.">
  <meta name="theme-color" content="#050810">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F464;</text></svg>">
  <link rel="stylesheet" href="style.css?v=6">
  <style>
    .er-wrap { max-width: 1000px; margin: 0 auto; padding: 20px; font-family: 'JetBrains Mono', 'Courier New', monospace; color: var(--text-primary); }

    .er-header { text-align: center; padding: 30px 0 20px; border-bottom: 2px solid #8b5cf6; margin-bottom: 30px; }
    .er-header h1 { font-family: 'Playfair Display', serif; font-size: 2.2rem; color: #8b5cf6; letter-spacing: -1px; margin-bottom: 8px; }
    .er-header .subtitle { font-size: 0.85rem; color: var(--text-tertiary); }

    .sys-status { 
      background: rgba(139, 92, 246, 0.05); 
      border: 1px solid rgba(139, 92, 246, 0.3); 
      border-radius: 8px; 
      padding: 14px 20px; 
      margin-bottom: 24px; 
      font-size: 0.75rem; 
      color: #8b5cf6; 
      text-transform: uppercase; 
      letter-spacing: 1.5px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .sys-status .label { color: var(--text-tertiary); }
    .sys-status .online { color: #8b5cf6; font-weight: 700; animation: blink 2s infinite;}

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    .entity-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 20px;
    }

    .entity-card {
        background: #0a0a0c;
        border: 1px solid #222;
        border-top: 4px solid #8b5cf6;
        border-radius: 6px;
        padding: 20px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        display: flex;
        flex-direction: column;
        gap: 12px;
        transition: transform 0.2s, border-color 0.2s;
    }
    
    .entity-card:hover {
        transform: translateY(-2px);
        border-color: #8b5cf6;
    }

    .e-name {
        font-family: 'Inter', sans-serif;
        font-weight: 800;
        font-size: 1.2rem;
        color: #fff;
    }
    
    .e-stats {
        display: flex;
        justify-content: space-between;
        background: rgba(255,255,255,0.03);
        padding: 10px;
        border-radius: 4px;
        font-size: 0.8rem;
    }
    
    .hits { color: #10b981; font-weight: bold; }
    
    .e-alias {
        font-size: 0.8rem;
        color: #aaa;
    }

    .alias-hl {
        color: #f59e0b;
        background: rgba(245, 158, 11, 0.1);
        padding: 2px 6px;
        border-radius: 3px;
    }

    .e-meta {
        margin-top: auto;
        font-size: 0.65rem;
        color: #555;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    
    .e-hash { color: #8b5cf6; font-family: monospace; }
  </style>
</head>
<body>
  <div id="nav-placeholder"></div>

  <div class="er-wrap">
    <div class="er-header">
      <h1>Entity Registry</h1>
      <div class="subtitle">Disambiguated Formal Target Index</div>
    </div>

    <div class="sys-status">
      <div><span class="label">Scanner Loop:</span> <span class="online">ACTIVE TICK (90s)</span></div>
      <div><span class="label">Resolution Matrices:</span> Darkweb & Social Base</div>
      <div><span class="label">Formal Nodes:</span> <span id="idx-count">0</span></div>
    </div>

    <div class="entity-grid" id="entity-grid">
        <div id="loader" style="padding:20px; color:#8b5cf6; font-size:0.8rem; text-align:center; grid-column: 1 / -1;">RESOLVING ALIAS MATRICES...</div>
    </div>
  </div>

  <script src="nav.js?v=13"></script>
  <script>
    const tpTpl = buildNavHtml();
    document.getElementById('nav-placeholder').innerHTML = tpTpl;
    if(typeof attachNavEvents === 'function') attachNavEvents();

    async function fetchEntities() {
        try {
            const response = await fetch('http://127.0.0.1:8091/api/entities');
            if(!response.ok) throw new Error('Daemon Offline');
            
            const payload = await response.json();
            
            if (payload && payload.status === "success") {
                const results = payload.data || [];
                document.getElementById('idx-count').innerText = results.length;
                renderList(results);
            }
        } catch(error) {
            console.error(error);
            document.getElementById('idx-count').innerText = "DISCONNECTED";
            document.getElementById('entity-grid').innerHTML = `<div style="text-align:center; color:#ef4444; margin-top:40px; grid-column: 1 / -1;">ERROR: STARK DISAMBIGUATION MAP OFFLINE. START UNIFIED DAEMON.</div>`;
        }
    }

    function renderList(results) {
        const gridDiv = document.getElementById('entity-grid');
        gridDiv.innerHTML = "";

        if (results.length === 0) {
            gridDiv.innerHTML = `<div style="color:#888; padding:20px; text-align:center; grid-column: 1 / -1;">No registered entities extracted from current matrices.</div>`;
            return;
        }

        results.forEach((item) => {
            const timeStr = new Date(item.last_updated * 1000).toLocaleString();
            
            const el = document.createElement('div');
            el.className = "entity-card";

            el.innerHTML = `
                <div class="e-name">${item.formal_name}</div>
                
                <div class="e-stats">
                    <div>Matrix Presence:</div>
                    <div class="hits">${item.hit_count} Hits</div>
                </div>

                <div class="e-alias">
                    Last Parsed Alias string: <span class="alias-hl">"${item.last_alias_matched}"</span>
                </div>

                <div class="e-meta">
                    <div class="e-hash">${item.crypto_signature.substring(0, 16)}...</div>
                    <div>${timeStr}</div>
                </div>
            `;
            gridDiv.appendChild(el);
        });
    }

    fetchEntities();
    setInterval(fetchEntities, 10000); // Poll every 10s
  </script>
</body>
</html>
