<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-label="Sunroom gentlemen's summer fashion">
  <defs>
    <linearGradient id="sky10" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#243640"/>
      <stop offset="55%" stop-color="#121a20"/>
      <stop offset="100%" stop-color="#050708"/>
    </linearGradient>
    <linearGradient id="glow10" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4a574" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#050708" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#sky10)"/>
  <rect width="600" height="400" fill="url(#glow10)"/>
  <!-- horizon / lake -->
  <rect x="0" y="500" width="600" height="300" fill="#0b1014"/>
  <line x1="0" y1="500" x2="600" y2="500" stroke="#c4a574" stroke-opacity="0.25" stroke-width="1"/>
  <!-- figure: three-quarter glam, face in hat shadow (magazine craft) -->
  <ellipse cx="300" cy="200" rx="38" ry="44" fill="#1a1614"/>
  <!-- hair sweep over shoulder -->
  <path d="M270 190 Q230 280 260 340" fill="none" stroke="#2a2420" stroke-width="18" stroke-linecap="round"/>
  <!-- hat brim silhouette -->
  <ellipse cx="300" cy="175" rx="68" ry="11" fill="#0d0d0d"/>
  <rect x="272" y="140" width="56" height="36" rx="6" fill="#0d0d0d"/>
  <!-- confident shoulders + dress -->
  <path d="M245 255 Q230 380 210 500 L390 500 Q370 380 355 255 Q300 275 245 255 Z" fill="#d4b896" opacity="0.9"/>
  <path d="M245 255 Q300 290 355 255" fill="none" stroke="#ece7dc" stroke-opacity="0.35" stroke-width="1.2"/>
  <!-- waist cinch suggestion -->
  <ellipse cx="300" cy="340" rx="48" ry="8" fill="none" stroke="#050708" stroke-opacity="0.2" stroke-width="2"/>
  <!-- long legs -->
  <line x1="272" y1="500" x2="268" y2="620" stroke="#2a2420" stroke-width="9" stroke-linecap="round"/>
  <line x1="328" y1="500" x2="336" y2="620" stroke="#2a2420" stroke-width="9" stroke-linecap="round"/>
  <text x="300" y="680" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="3" fill="#c4a574">GENTLEMEN'S SUMMER</text>
  <text x="300" y="710" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#e8e2d6">resort wrap dress, gold-tone sandals, co</text>
  <text x="300" y="740" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#827a6d">quiet residential street of brick houses</text>
  <text x="300" y="770" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" letter-spacing="2" fill="#3f7c8c">SUNROOM · TENET5 · POWERED BY LIRIL AI</text>
</svg>
