  <text x="400" y="454" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" letter-spacing="2" fill="#3f7c8c">TENET5 · PUBLIC RECORD SATIRE · POWERED BY LIRIL AI</text>
