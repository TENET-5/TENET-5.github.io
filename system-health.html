<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Health | TENET5 Daemon Monitor</title>
  <meta name="description" content="TENET5 Unified Daemon Health & Infrastructure Monitor.">
  <meta name="theme-color" content="#050810">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F6E1;</text></svg>">
  <link rel="stylesheet" href="style.css?v=6">
  <style>
    .sh-wrap { max-width: 1100px; margin: 0 auto; padding: 20px; font-family: 'JetBrains Mono', 'Courier New', monospace; color: var(--text-primary); }

    .sh-header { text-align: center; padding: 30px 0 20px; border-bottom: 2px solid #10b981; margin-bottom: 30px; }
    .sh-header h1 { font-family: 'Playfair Display', serif; font-size: 2.2rem; color: #10b981; letter-spacing: -1px; margin-bottom: 8px; }
    .sh-header .subtitle { font-size: 0.85rem; color: var(--text-tertiary); }

    .topline {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .topline-card {
      background: #0a0a0c;
      border: 1px solid #222;
      border-top: 3px solid #10b981;
      border-radius: 6px;
      padding: 16px;
      text-align: center;
    }
    .topline-card .val { font-size: 1.8rem; font-weight: 800; color: #10b981; }
    .topline-card .lbl { font-size: 0.7rem; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

    .section-title { font-size: 0.8rem; text-transform: uppercase; color: #10b981; letter-spacing: 2px; margin: 24px 0 12px; border-bottom: 1px solid #222; padding-bottom: 6px; }

    .loop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .loop-card {
      background: #0a0a0c;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .loop-card .loop-name { font-size: 0.9rem; font-weight: 700; color: #fff; }
    .loop-card .loop-row { display: flex; justify-content: space-between; font-size: 0.75rem; color: #aaa; }

    .badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 0.7rem; font-weight: 700; }
    .badge-healthy { background: rgba(16,185,129,0.15); color: #10b981; border: 1px solid rgba(16,185,129,0.3); }
    .badge-waiting { background: rgba(245,158,11,0.15); color: #f59e0b; border: 1px solid rgba(245,158,11,0.3); }
    .badge-stalled { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }
    .badge-degraded { background: rgba(168,85,247,0.15); color: #a855f7; border: 1px solid rgba(168,85,247,0.3); }

    .db-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
    }

    .db-cell {
      background: #0a0a0c;
      border: 1px solid #222;
      border-radius: 4px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
    }
    .db-cell .tbl-name { color: #aaa; }
    .db-cell .tbl-count { color: #10b981; font-weight: 700; font-size: 1.1rem; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .pulse { animation: pulse 2s infinite; }
  </style>
</head>
<body>
  <div id="nav-placeholder"></div>

  <div class="sh-wrap">
    <div class="sh-header">
      <h1>System Health Monitor</h1>
      <div class="subtitle">Unified Daemon Infrastructure & Loop Integrity</div>
    </div>

    <div class="topline" id="topline">
      <div class="topline-card"><div class="val" id="v-status">--</div><div class="lbl">Daemon Status</div></div>
      <div class="topline-card"><div class="val" id="v-uptime">--</div><div class="lbl">Uptime</div></div>
      <div class="topline-card"><div class="val" id="v-endpoints">--</div><div class="lbl">API Endpoints</div></div>
      <div class="topline-card"><div class="val" id="v-loops">--</div><div class="lbl">Async Loops</div></div>
      <div class="topline-card"><div class="val" id="v-nats">--</div><div class="lbl">NATS</div></div>
    </div>

    <div class="section-title">Async Loop Health</div>
    <div class="loop-grid" id="loop-grid"></div>

    <div class="section-title">Database Row Counts</div>
    <div class="db-grid" id="db-grid"></div>
  </div>

  <script src="nav.js?v=15"></script>
  <script>
    const tpTpl = buildNavHtml();
    document.getElementById('nav-placeholder').innerHTML = tpTpl;
    if(typeof attachNavEvents === 'function') attachNavEvents();

    const badgeClass = (s) => {
      if (s === 'HEALTHY') return 'badge-healthy';
      if (s === 'WAITING') return 'badge-waiting';
      if (s === 'STALLED') return 'badge-stalled';
      return 'badge-degraded';
    };

    async function poll() {
      try {
        const res = await fetch('http://127.0.0.1:8091/api/health');
        if (!res.ok) throw new Error('Offline');
        const json = await res.json();
        const d = json.data;

        document.getElementById('v-status').textContent = d.status;
        document.getElementById('v-status').style.color = '#10b981';
        document.getElementById('v-uptime').textContent = d.uptime;
        document.getElementById('v-endpoints').textContent = d.api_endpoints;
        document.getElementById('v-loops').textContent = d.async_loops;
        document.getElementById('v-nats').textContent = d.nats_connected ? 'CONNECTED' : 'OFFLINE';
        document.getElementById('v-nats').style.color = d.nats_connected ? '#10b981' : '#ef4444';

        // Loops
        const lg = document.getElementById('loop-grid');
        lg.innerHTML = '';
        for (const [name, info] of Object.entries(d.loops)) {
          const el = document.createElement('div');
          el.className = 'loop-card';
          el.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div class="loop-name">${name.replace(/_/g, ' ')}</div>
              <span class="badge ${badgeClass(info.status)}">${info.status}</span>
            </div>
            <div class="loop-row"><span>Ticks:</span><span>${info.ticks}</span></div>
            <div class="loop-row"><span>Errors:</span><span style="color:${info.errors > 0 ? '#ef4444' : '#10b981'}">${info.errors}</span></div>
            <div class="loop-row"><span>Interval:</span><span>${info.interval_s}s</span></div>
            <div class="loop-row"><span>Last tick:</span><span>${info.last_tick_ago_s !== null ? info.last_tick_ago_s + 's ago' : '—'}</span></div>
          `;
          lg.appendChild(el);
        }

        // DB rows
        const dg = document.getElementById('db-grid');
        dg.innerHTML = '';
        for (const [tbl, count] of Object.entries(d.db_rows)) {
          const el = document.createElement('div');
          el.className = 'db-cell';
          el.innerHTML = `<span class="tbl-name">${tbl}</span><span class="tbl-count">${count}</span>`;
          dg.appendChild(el);
        }
      } catch(e) {
        document.getElementById('v-status').textContent = 'OFFLINE';
        document.getElementById('v-status').style.color = '#ef4444';
      }
    }

    poll();
    setInterval(poll, 5000);
  </script>
</body>
</html>
