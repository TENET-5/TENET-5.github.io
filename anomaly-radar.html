<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anomaly Radar | TENET5 Analytics</title>
  <meta name="description" content="TENET5 Autonomous Analytical Array. Detecting OSINT matrix deviations.">
  <meta name="theme-color" content="#050810">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x26A0;&#xFE0F;</text></svg>">
  <link rel="stylesheet" href="style.css?v=6">
  <style>
    .radar-wrap { max-width: 1000px; margin: 0 auto; padding: 20px; font-family: 'JetBrains Mono', 'Courier New', monospace; color: var(--text-primary); }

    .radar-header { text-align: center; padding: 30px 0 20px; border-bottom: 2px solid #f59e0b; margin-bottom: 30px; }
    .radar-header h1 { font-family: 'Playfair Display', serif; font-size: 2.2rem; color: #f59e0b; letter-spacing: -1px; margin-bottom: 8px; }
    .radar-header .subtitle { font-size: 0.85rem; color: var(--text-tertiary); }

    .sys-status { 
      background: rgba(245, 158, 11, 0.05); 
      border: 1px solid rgba(245, 158, 11, 0.3); 
      border-radius: 8px; 
      padding: 14px 20px; 
      margin-bottom: 24px; 
      font-size: 0.75rem; 
      color: #f59e0b; 
      text-transform: uppercase; 
      letter-spacing: 1.5px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .sys-status .label { color: var(--text-tertiary); }
    .sys-status .online { color: #f59e0b; font-weight: 700; animation: blink 2s infinite;}

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    .anomaly-list {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .anomaly-card {
        background: #0a0a0c;
        border-left: 4px solid #f59e0b;
        border-radius: 6px;
        padding: 20px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        display: grid;
        grid-template-columns: 80px 1fr 150px;
        align-items: center;
        gap: 20px;
    }

    @media (max-width: 768px) {
        .anomaly-card { grid-template-columns: 1fr; text-align: center; }
    }

    .score-box {
        background: rgba(245, 158, 11, 0.1);
        border: 1px solid rgba(245, 158, 11, 0.4);
        color: #f59e0b;
        border-radius: 50%;
        width: 60px;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        font-weight: bold;
        margin: 0 auto;
    }
    .score-critical { background: rgba(239, 68, 68, 0.2); border-color: #ef4444; color: #ef4444; }

    .anomaly-data {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .anomaly-data h3 { margin: 0; font-size: 1.1rem; color: #fff; font-family: 'Inter', sans-serif;}
    .anomaly-data .context { font-size: 0.85rem; color: #c8c8ce; line-height: 1.4; border-left: 2px solid #333; padding-left: 10px;}
    
    .anomaly-meta {
        font-size: 0.7rem;
        color: #888;
        text-align: right;
    }
    @media (max-width: 768px) { .anomaly-meta { text-align: center; } }
    .hash { color: #f59e0b; font-size: 0.65rem; word-break: break-all;}

  </style>
</head>
<body>
  <div id="nav-placeholder"></div>

  <div class="radar-wrap">
    <div class="radar-header">
      <h1>Anomaly Radar</h1>
      <div class="subtitle">Autonomous AI Analytical Deviations Sweep</div>
    </div>

    <div class="sys-status">
      <div><span class="label">Scanner Loop:</span> <span class="online">ACTIVE TICK (60s)</span></div>
      <div><span class="label">Data Source:</span> .liril_discoveries.db Matrices</div>
      <div><span class="label">Anomalies Detected:</span> <span id="idx-count">0</span></div>
    </div>

    <div class="anomaly-list" id="anomaly-list">
        <div id="loader" style="padding:20px; color:#f59e0b; font-size:0.8rem; text-align:center;">SCANNING MATRIX...</div>
    </div>
  </div>

  <script src="nav.js?v=10"></script>
  <script>
    const tpTpl = buildNavHtml();
    document.getElementById('nav-placeholder').innerHTML = tpTpl;
    if(typeof attachNavEvents === 'function') attachNavEvents();

    async function fetchAnomalies() {
        try {
            const response = await fetch('http://127.0.0.1:8091/api/anomalies');
            if(!response.ok) throw new Error('Daemon Offline');
            
            const payload = await response.json();
            
            if (payload && payload.status === "success") {
                const results = payload.data || [];
                document.getElementById('idx-count').innerText = results.length;
                renderList(results);
            }
        } catch(error) {
            console.error(error);
            document.getElementById('idx-count').innerText = "DISCONNECTED";
            document.getElementById('anomaly-list').innerHTML = `<div style="text-align:center; color:#ef4444; margin-top:40px;">ERROR: STARK ANALYTICAL BRIDGE OFFLINE. START UNIFIED DAEMON.</div>`;
        }
    }

    function renderList(results) {
        const listDiv = document.getElementById('anomaly-list');
        listDiv.innerHTML = "";

        if (results.length === 0) {
            listDiv.innerHTML = `<div style="color:#888; padding:20px; text-align:center;">Matrix stability nominal. No deviations detected above scoring threshold.</div>`;
            return;
        }

        results.forEach((item) => {
            const timeStr = new Date(item.timestamp * 1000).toLocaleString();
            const isCrit = item.severity_score >= 15.0;
            const scoreClass = isCrit ? "score-box score-critical" : "score-box";
            
            const el = document.createElement('div');
            el.className = "anomaly-card";
            if (isCrit) el.style.borderLeftColor = "#ef4444";

            el.innerHTML = `
                <div class="${scoreClass}">${item.severity_score.toFixed(1)}</div>
                <div class="anomaly-data">
                    <h3>Origin Vector: ${item.source_node.toUpperCase()}</h3>
                    <div class="context">${item.context}</div>
                </div>
                <div class="anomaly-meta">
                    <div>Detected:</div>
                    <div style="color:#fff; margin-bottom: 5px;">${timeStr}</div>
                    <div>Ledger Hash:</div>
                    <div class="hash">${item.crypto_signature}</div>
                </div>
            `;
            listDiv.appendChild(el);
        });
    }

    fetchAnomalies();
    setInterval(fetchAnomalies, 10000); // Poll every 10s for new background sweep hits
  </script>
</body>
</html>
