  </div>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    (async () => {
      const SUPABASE_URL  = window.SUPABASE_URL  || 'https://YOUR_PROJECT.supabase.co';
      const SUPABASE_ANON = window.SUPABASE_ANON || 'YOUR_ANON_KEY';
      const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

      const msg = document.getElementById('auth-msg');
      try {
        const { data, error } = await sb.auth.exchangeCodeForSession(window.location.href);
        if (error) throw error;
        msg.textContent = `Welcome, ${data.user?.user_metadata?.full_name || 'friend'}! Redirecting…`;
        setTimeout(() => {
          const returnTo = sessionStorage.getItem('t5-auth-return') || '/';
          sessionStorage.removeItem('t5-auth-return');
          window.location.href = returnTo;
        }, 1200);
      } catch(e) {
        msg.textContent = 'Sign-in failed: ' + e.message + '. Redirecting to home…';
        setTimeout(() => window.location.href = '/', 2500);
      }
    })();
  </script>
