<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIRIL Intelligence Dossier | TENET5</title>
  <meta name="description" content="Automated structural OSINT dossier generated by the TENET5/LIRIL cognitive engine.">
  <link rel="stylesheet" href="style.css?v=3">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    /* Dossier Viewer Custom Aesthetics */
    body {
      background: #050506;
      color: #ededed;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .dossier-hero {
      background: linear-gradient(135deg, #0a0c10 0%, #11050a 100%);
      padding: 2rem 0;
      border-bottom: 1px solid rgba(196, 30, 58, 0.2);
    }
    .dossier-hero h1 {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(1.2rem, 3vw, 2rem);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }
    .dossier-hero .liril-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(196,30,58,0.1);
      border: 1px solid rgba(196,30,58,0.3);
      padding: 4px 12px;
      font-size: 0.7rem;
      font-family: 'JetBrains Mono', monospace;
      color: #c41e3a;
      border-radius: 4px;
      margin-bottom: 1rem;
    }
    .status-pulse {
      width: 6px; height: 6px;
      background: #c41e3a;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(196,30,58,0.4); }
      50% { opacity: 0.6; box-shadow: 0 0 0 4px rgba(196,30,58,0); }
    }
    
    /* Markdown Markdown Container */
    #content-container {
      max-width: 900px;
      margin: 2rem auto;
      padding: 2rem;
      background: #0b0b0e;
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 8px;
      font-family: 'Inter', -apple-system, sans-serif;
      line-height: 1.8;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    
    /* Markdown Overrides */
    #content-container h1, #content-container h2, #content-container h3 {
      font-family: 'Playfair Display', serif;
      color: #fff;
      margin-top: 2rem;
      margin-bottom: 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 0.5rem;
    }
    #content-container h1 { font-size: 2.2rem; color: #c41e3a; }
    #content-container h2 { font-size: 1.6rem; }
    #content-container h3 { font-size: 1.3rem; color: #5b9cf5; border-bottom: none; }
    
    #content-container ul, #content-container ol {
      margin-bottom: 1.5rem;
      padding-left: 1.5rem;
      color: #a0a0a6;
    }
    #content-container li { margin-bottom: 0.5rem; }
    #content-container strong { color: #ededed; }
    
    #content-container blockquote {
      border-left: 4px solid #c41e3a;
      background: rgba(196,30,58,0.05);
      margin: 1.5rem 0;
      padding: 1rem 1.5rem;
      color: #c4c4cc;
      font-style: italic;
    }
    
    #content-container pre {
      background: #050506;
      padding: 1rem;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.1);
      overflow-x: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
    }
    #content-container code {
      background: rgba(255,255,255,0.1);
      padding: 0.15rem 0.35rem;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85em;
      color: #ff6b6b;
    }
    #content-container pre code { background: none; padding: 0; color: #a0a0a6; }
    
    #content-container table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
      font-size: 0.9rem;
    }
    #content-container th {
      background: rgba(255,255,255,0.05);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding: 10px;
      text-align: left;
      font-weight: 600;
      color: #ededed;
    }
    #content-container td {
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding: 10px;
      color: #a0a0a6;
    }
    #content-container a {
      color: #5b9cf5;
      text-decoration: none;
    }
    #content-container a:hover {
      text-decoration: underline;
    }

    #loading-state {
      text-align: center;
      padding: 4rem;
      color: #c41e3a;
      font-family: 'JetBrains Mono', monospace;
    }
    
    .back-nav {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #a0a0a6;
      text-decoration: none;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      margin-bottom: 1.5rem;
      transition: color 0.2s;
    }
    .back-nav:hover { color: #fff; }

  </style>
</head>
<body>

  <nav id="site-nav"></nav>

  <div class="dossier-hero">
    <div class="content" style="max-width:900px; margin:0 auto; padding: 0 2rem;">
      <a href="osint-dashboard.html" class="back-nav">← RETURN TO MAIN DASHBOARD</a>
      <div>
        <div class="liril-badge"><div class="status-pulse"></div> LIRIL SUBKERNEL DOSSIER</div>
      </div>
      <h1 id="dossier-title">Loading Intelligence File...</h1>
      <p style="color:#6e6e76; font-size:0.85rem; font-family:'JetBrains Mono', monospace;">DECRYPTED AT: <span id="timestamp"></span></p>
    </div>
  </div>

  <div class="content" style="flex: 1; width:100%;">
    <div id="content-container">
      <div id="loading-state">
        [ INITIATING SECURE FETCH SEQUENCE ]<br><br>...
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 Daniel Perry. All rights reserved.</p>
    <p>Automated output directly rendered from LIRIL markdown structures. <a href="accountability.html">Return to Database</a></p>
  </footer>

  <script src="nav.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('timestamp').innerText = new Date().toISOString() + " [UTC]";

      const urlParams = new URLSearchParams(window.location.search);
      const file = urlParams.get('file');

      const container = document.getElementById('content-container');
      const titleSpan = document.getElementById('dossier-title');

      if (!file) {
        container.innerHTML = '<div style="color:#e05050;text-align:center;">ERROR: NO TARGET FILE SPECIFIED.</div>';
        titleSpan.innerText = "ACCESS DENIED";
        return;
      }

      // Title + JSON vs MD detection
      const isJSON = file.endsWith('.json');
      let rawName = file.split('/').pop().replace(/\.(md|json)$/, '').replace(/_/g, ' ').toUpperCase();
      titleSpan.innerText = rawName;

      fetch(file)
        .then(response => {
          if (!response.ok) throw new Error(`HTTP ${response.status} — TARGET NOT FOUND`);
          return isJSON ? response.json() : response.text();
        })
        .then(data => {
          if (isJSON) {
            container.innerHTML = renderJSON(data);
          } else {
            if (typeof marked === 'undefined') {
              container.innerHTML = '<div style="color:#e05050;text-align:center;">ERROR: MARKED CDN FAILED TO LOAD.</div>';
              return;
            }
            container.innerHTML = marked.parse(data);
          }
        })
        .catch(err => {
          container.innerHTML = `<div style="color:#e05050;text-align:center;font-family:'JetBrains Mono';">ERROR: FAILED TO DECRYPT DOSSIER.<br><br>${err.message}</div>`;
        });

      function renderJSON(d) {
        const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        const linkify = s => /^https?:\/\//.test(s) ? `<a href="${esc(s)}" target="_blank" rel="noopener" style="color:#5b9cf5;">${esc(s)}</a>` : esc(s);
        function val(v, depth) {
          if (v === null) return '<span style="color:#555">null</span>';
          if (typeof v === 'boolean') return `<span style="color:#5b9cf5">${v}</span>`;
          if (typeof v === 'number') return `<span style="color:#f5a623">${v.toLocaleString()}</span>`;
          if (typeof v === 'string') return `<span style="color:#a8d8a8">${linkify(v)}</span>`;
          if (Array.isArray(v)) {
            if (!v.length) return '<span style="color:#555">—</span>';
            return '<ul style="margin:4px 0 4px 1.2rem;padding:0;">' +
              v.map(item => `<li style="margin:3px 0;">${val(item, depth+1)}</li>`).join('') + '</ul>';
          }
          if (typeof v === 'object') return renderObj(v, depth+1);
          return esc(String(v));
        }
        function renderObj(o, depth) {
          const entries = Object.entries(o);
          if (!entries.length) return '<span style="color:#555">{}</span>';
          const bg = depth === 0 ? 'rgba(255,255,255,0.03)' : depth === 1 ? 'rgba(255,255,255,0.015)' : 'transparent';
          const border = depth <= 1 ? 'border:1px solid rgba(255,255,255,0.07);border-radius:8px;' : 'border-left:2px solid rgba(196,30,58,0.2);';
          let h = `<div style="background:${bg};${border}padding:${depth<=1?'1rem':'0.4rem 0.75rem'};margin:${depth<=1?'1rem 0':'4px 0'};">`;
          for (const [k, v] of entries) {
            const kLabel = k.replace(/_/g,' ').toUpperCase();
            h += `<div style="margin:6px 0;"><span style="color:#c41e3a;font-weight:700;font-size:0.75rem;letter-spacing:0.5px;">${esc(kLabel)}</span>`;
            if (typeof v === 'object' && v !== null && !Array.isArray(v)) {
              h += renderObj(v, depth+1);
            } else {
              h += `<span style="color:#444;margin:0 6px;">-></span>${val(v, depth)}`;
            }
            h += '</div>';
          }
          h += '</div>';
          return h;
        }
        if (d.meta && d.meta.name) titleSpan.innerText = d.meta.name.toUpperCase() + ' — LIRIL DOSSIER';
        else if (d.name) titleSpan.innerText = String(d.name).toUpperCase() + ' — LIRIL DOSSIER';
        else if (d.title) titleSpan.innerText = String(d.title).toUpperCase();
        return `<div style="font-family:'JetBrains Mono',monospace;font-size:0.82rem;line-height:1.7;max-width:900px;margin:0 auto;padding:2rem;">${renderObj(d, 0)}</div>`;
      }
    });
  </script>
</body>
</html>
