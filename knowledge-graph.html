<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Graph | TENET5 Matrix</title>
  <meta name="description" content="TENET5 Relational Triple Semantic Graph.">
  <meta name="theme-color" content="#050810">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x26D3;&#xFE0F;</text></svg>">
  <link rel="stylesheet" href="style.css?v=6">
  <style>
    .kg-wrap { max-width: 1200px; margin: 0 auto; padding: 20px; font-family: 'JetBrains Mono', 'Courier New', monospace; color: var(--text-primary); }

    .kg-header { text-align: center; padding: 30px 0 20px; border-bottom: 2px solid #3b82f6; margin-bottom: 30px; }
    .kg-header h1 { font-family: 'Playfair Display', serif; font-size: 2.2rem; color: #3b82f6; letter-spacing: -1px; margin-bottom: 8px; }
    .kg-header .subtitle { font-size: 0.85rem; color: var(--text-tertiary); }

    .sys-status { 
      background: rgba(59, 130, 246, 0.05); 
      border: 1px solid rgba(59, 130, 246, 0.3); 
      border-radius: 8px; 
      padding: 14px 20px; 
      margin-bottom: 24px; 
      font-size: 0.75rem; 
      color: #3b82f6; 
      text-transform: uppercase; 
      letter-spacing: 1.5px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .sys-status .label { color: var(--text-tertiary); }
    .sys-status .online { color: #3b82f6; font-weight: 700; animation: blink 2s infinite;}

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    #graph-container {
        width: 100%;
        height: 600px;
        background: #0a0a0c;
        border: 1px solid #222;
        border-radius: 8px;
        overflow: hidden;
        position: relative;
    }
    
    #loader {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #3b82f6;
    }

    .node-details {
        margin-top: 20px;
        padding: 20px;
        background: #0a0a0c;
        border-left: 4px solid #3b82f6;
        border-radius: 6px;
        display: none;
    }
    
    .edge-list {
        margin-top: 20px;
        display: grid;
        gap: 10px;
        font-family: "Inter", sans-serif;
    }
    .edge-row {
        padding: 10px;
        background: rgba(255,255,255,0.03);
        border: 1px solid #222;
        border-radius: 4px;
        font-size: 0.85rem;
    }
    .e-subj { color: #f59e0b; font-weight: bold; }
    .e-pred { color: #8b5cf6; margin: 0 10px; }
    .e-obj { color: #10b981; font-weight: bold; }

  </style>
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
  <div id="nav-placeholder"></div>

  <div class="kg-wrap">
    <div class="kg-header">
      <h1>Knowledge Graph</h1>
      <div class="subtitle">TENET5 Semantic Relation Visualizer</div>
    </div>

    <div class="sys-status">
      <div><span class="label">Compiler Loop:</span> <span class="online">ACTIVE (600s)</span></div>
      <div><span class="label">Mapped Edges:</span> <span id="idx-count">0</span></div>
      <div><span class="label">Render Mode:</span> D3.js Force-Directed</div>
    </div>

    <div id="graph-container">
        <div id="loader">EXTRACTING RELATIONAL MATRICES...</div>
    </div>
    
    <div id="node-details" class="node-details">
        <h3 id="nd-title" style="margin-top:0; color:#3b82f6;"></h3>
        <div id="nd-content"></div>
    </div>

    <div class="edge-list" id="edge-list"></div>
  </div>

  <script src="nav.js?v=13"></script>
  <script>
    const tpTpl = buildNavHtml();
    document.getElementById('nav-placeholder').innerHTML = tpTpl;
    if(typeof attachNavEvents === 'function') attachNavEvents();

    let simulation;
    let svg;

    async function fetchGraph() {
        try {
            const response = await fetch('http://127.0.0.1:8091/api/graph');
            if(!response.ok) throw new Error('Daemon Offline');
            
            const payload = await response.json();
            
            if (payload && payload.status === "success") {
                const edges = payload.data || [];
                document.getElementById('idx-count').innerText = edges.length;
                document.getElementById('loader').style.display = 'none';
                renderList(edges);
                buildD3Graph(edges);
            }
        } catch(error) {
            console.error(error);
            document.getElementById('idx-count').innerText = "DISCONNECTED";
            document.getElementById('loader').innerText = "ERROR: STARK GRAPH BRIDGE OFFLINE.";
            document.getElementById('loader').style.color = "#ef4444";
        }
    }

    function renderList(edges) {
        const listDiv = document.getElementById('edge-list');
        listDiv.innerHTML = "";
        
        edges.forEach(e => {
            const row = document.createElement('div');
            row.className = "edge-row";
            row.innerHTML = `[${e.source_reference}] <span class="e-subj">${e.subject}</span> <span class="e-pred">${e.predicate.replace(/_/g, ' ')}</span> <span class="e-obj">${e.object}</span>`;
            listDiv.appendChild(row);
        });
    }

    function buildD3Graph(edges) {
        const container = document.getElementById('graph-container');
        container.innerHTML = ""; // Clear existing

        const width = container.clientWidth;
        const height = container.clientHeight;

        svg = d3.select("#graph-container").append("svg")
            .attr("width", width)
            .attr("height", height)
            .call(d3.zoom().on("zoom", function (event) {
               svg.attr("transform", event.transform)
            }))
            .append("g");

        // Parse unique nodes and links
        const nodesData = {};
        const linksData = [];

        edges.forEach(e => {
            if (!nodesData[e.subject]) nodesData[e.subject] = { id: e.subject, group: 1 };
            if (!nodesData[e.object]) nodesData[e.object] = { id: e.object, group: 2 };
            
            linksData.push({
                source: e.subject,
                target: e.object,
                label: e.predicate
            });
        });

        const nodes = Object.values(nodesData);
        const links = linksData;

        simulation = d3.forceSimulation(nodes)
            .force("link", d3.forceLink(links).id(d => d.id).distance(150))
            .force("charge", d3.forceManyBody().strength(-400))
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("x", d3.forceX(width / 2).strength(0.05))
            .force("y", d3.forceY(height / 2).strength(0.05));

        // Arrow marker
        svg.append("defs").append("marker")
            .attr("id", "arrowhead")
            .attr("viewBox", "-0 -5 10 10")
            .attr("refX", 20)
            .attr("refY", 0)
            .attr("orient", "auto")
            .attr("markerWidth", 8)
            .attr("markerHeight", 8)
            .attr("xoverflow", "visible")
            .append("svg:path")
            .attr("d", "M 0,-5 L 10 ,0 L 0,5")
            .attr("fill", "#666")
            .style("stroke","none");

        const link = svg.append("g")
            .attr("class", "links")
            .selectAll("line")
            .data(links)
            .enter().append("line")
            .attr("stroke", "#444")
            .attr("stroke-width", 2)
            .attr("marker-end", "url(#arrowhead)");

        const linkText = svg.append("g")
            .selectAll("text")
            .data(links)
            .enter().append("text")
            .text(d => d.label.replace(/_/g, ' '))
            .attr("fill", "#888")
            .attr("font-size", "10px")
            .attr("text-anchor", "middle");

        const node = svg.append("g")
            .attr("class", "nodes")
            .selectAll("circle")
            .data(nodes)
            .enter().append("circle")
            .attr("r", 10)
            .attr("fill", d => d.group === 1 ? "#f59e0b" : "#10b981")
            .call(d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended))
            .on("click", function(event, d) {
                const details = document.getElementById('node-details');
                details.style.display = 'block';
                document.getElementById('nd-title').innerText = "Node: " + d.id;
                
                let rels = edges.filter(e => e.subject === d.id || e.object === d.id);
                let html = `<strong>Relationships (${rels.length}):</strong><br>`;
                rels.forEach(r => {
                    html += `> ${r.subject} [${r.predicate}] ${r.object} <br>`;
                });
                document.getElementById('nd-content').innerHTML = html;
            });

        const text = svg.append("g")
            .attr("class", "labels")
            .selectAll("text")
            .data(nodes)
            .enter().append("text")
            .attr("dy", -15)
            .attr("text-anchor", "middle")
            .text(d => d.id)
            .attr("fill", "#fff")
            .attr("font-size", "12px")
            .attr("font-family", "Inter, sans-serif");

        simulation
            .nodes(nodes)
            .on("tick", ticked);

        simulation.force("link")
            .links(links);

        function ticked() {
            link
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);

            node
                .attr("cx", d => Math.max(10, Math.min(width - 10, d.x)))
                .attr("cy", d => Math.max(10, Math.min(height - 10, d.y)));
                
            text
                .attr("x", d => d.x)
                .attr("y", d => d.y);
                
            linkText
                .attr("x", d => (d.source.x + d.target.x) / 2)
                .attr("y", d => (d.source.y + d.target.y) / 2 - 5);
        }
    }

    function dragstarted(event, d) {
      if (!event.active) simulation.alphaTarget(0.3).restart();
      d.fx = d.x;
      d.fy = d.y;
    }

    function dragged(event, d) {
      d.fx = event.x;
      d.fy = event.y;
    }

    function dragended(event, d) {
      if (!event.active) simulation.alphaTarget(0);
      d.fx = null;
      d.fy = null;
    }

    fetchGraph();
    // Do not set interval fetch for D3 graph as it will reset physics simulation continuously. Data is pulled on load.
  </script>
</body>
</html>
