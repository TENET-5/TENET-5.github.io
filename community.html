<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Chat — TENET5</title>
  <meta name="description" content="Join the TENET5 community. Discuss evidence, share OSINT research, and analyze government accountability data with other investigators.">
  <meta property="og:title" content="Community Chat — TENET5">
  <meta property="og:description" content="Real-time community discussion about Canadian government accountability.">
  <link rel="stylesheet" href="style.css?v=7">
  <meta name="theme-color" content="#1a1f36">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F1E8;&#x1F1E6;</text></svg>">

<!-- TENET5 SEO INJECT -->
  <!-- Dynamic SEO Enforced by TENET5 automated pipeline -->
  <meta property="og:title" content="Community Chat — TENET5">
  <meta property="og:url" content="https://tenet-5.github.io/community.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="TENET5 Accountability">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Community Chat — TENET5">
  <link rel="canonical" href="https://tenet-5.github.io/community.html">
  <script type="application/ld+json">
  {
  "@context": "https://schema.org",
  "@type": "WebPage",
  "name": "Community Chat \u2014 TENET5",
  "url": "https://tenet-5.github.io/community.html",
  "publisher": {
    "@type": "Organization",
    "name": "TENET5 Investigation",
    "logo": {
      "@type": "ImageObject",
      "url": "https://tenet-5.github.io/img/tenet5_logo.png"
    }
  }
}
  </script>
<!-- /TENET5 SEO INJECT -->
</head>
<body>
  <nav id="site-nav"></nav>

  <div class="community-container">
    <!-- Sidebar: Rooms + Online Users -->
    <aside class="chat-sidebar" id="chat-sidebar">
      <div class="chat-sidebar-header">
        <h3>💬 Channels</h3>
      </div>
      <div class="chat-rooms" id="chat-rooms">
        <!-- Populated by JS -->
      </div>
      <div class="chat-online-header">
        <h4>🟢 Online — <span id="online-count">0</span></h4>
      </div>
      <div class="chat-online-list" id="chat-online-list">
        <!-- Populated by JS -->
      </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="chat-main">
      <div class="chat-main-header" id="chat-main-header">
        <button class="chat-sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">☰</button>
        <span class="chat-room-icon" id="room-icon">💬</span>
        <span class="chat-room-name" id="room-name">General</span>
        <span class="chat-room-desc" id="room-desc">Open discussion</span>
      </div>

      <div class="chat-messages" id="chat-messages">
        <div class="chat-empty" id="chat-empty">
          <h3>Welcome to TENET5 Community</h3>
          <p>Sign in to join the conversation. Discuss evidence, share research, and help investigate government accountability.</p>
          <button class="dl-btn" id="chat-login-prompt" style="margin-top:1rem;">Sign in to Chat</button>
        </div>
      </div>

      <div class="chat-input-area" id="chat-input-area">
        <div class="chat-input-wrapper">
          <textarea class="chat-input" id="chat-input"
                    placeholder="Type your message... (Shift+Enter for newline)"
                    rows="1" maxlength="2000" disabled></textarea>
          <button class="chat-send-btn" id="chat-send-btn" disabled title="Send message">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </div>
        <div class="chat-input-info">
          <span class="chat-char-count" id="chat-char-count">0/2000</span>
          <span class="chat-rate-limit" id="chat-rate-limit"></span>
        </div>
      </div>
    </main>
  </div>

  <div id="read-next"></div>
  <footer id="site-footer"></footer>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

  <script src="nav.js?v=9"></script>
  <script src="footer.js?v=2"></script>
  <script src="readnext.js?v=2"></script>
  <script src="js/firebase-config.js?v=1"></script>
  <script src="js/auth-ui.js?v=1"></script>
  

  <script>
    (function () {
      'use strict';

      const messagesEl = document.getElementById('chat-messages');
      const inputEl = document.getElementById('chat-input');
      const sendBtn = document.getElementById('chat-send-btn');
      const charCount = document.getElementById('chat-char-count');
      const roomsEl = document.getElementById('chat-rooms');
      const onlineListEl = document.getElementById('chat-online-list');
      const onlineCountEl = document.getElementById('online-count');
      const emptyEl = document.getElementById('chat-empty');
      const loginPrompt = document.getElementById('chat-login-prompt');
      const sidebarToggle = document.getElementById('sidebar-toggle');
      const sidebar = document.getElementById('chat-sidebar');

      let isAuthenticated = false;

      // ── Build Room List ────────────────────────────────────
      function buildRooms() {
        const rooms = window.tenet5Chat ? window.tenet5Chat.getRooms() : {};
        const currentRoom = window.tenet5Chat ? window.tenet5Chat.getCurrentRoom() : 'general';
        
        roomsEl.innerHTML = Object.keys(rooms).map(function (key) {
          const r = rooms[key];
          const active = key === currentRoom ? ' active' : '';
          return '<button class="chat-room-btn' + active + '" data-room="' + key + '">' +
            '<span class="chat-room-btn-icon">' + r.icon + '</span>' +
            '<span class="chat-room-btn-name">' + r.name + '</span>' +
          '</button>';
        }).join('');

        roomsEl.querySelectorAll('.chat-room-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            const room = btn.dataset.room;
            if (window.tenet5Chat) {
              window.tenet5Chat.switchRoom(room);
              messagesEl.innerHTML = '';
              buildRooms();
              updateRoomHeader(room);
            }
          });
        });
      }

      function updateRoomHeader(roomId) {
        const rooms = window.tenet5Chat ? window.tenet5Chat.getRooms() : {};
        const room = rooms[roomId];
        if (room) {
          document.getElementById('room-icon').textContent = room.icon;
          document.getElementById('room-name').textContent = room.name;
          document.getElementById('room-desc').textContent = room.desc;
        }
      }

      // ── Render Message ─────────────────────────────────────
      function renderMessage(msg) {
        const div = document.createElement('div');
        div.className = 'chat-message';
        div.dataset.key = msg.key;

        const time = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
        const isOwn = window.tenet5Firebase && window.tenet5Firebase.currentUser && msg.uid === window.tenet5Firebase.currentUser.uid;
        const initial = (msg.displayName || '?').charAt(0).toUpperCase();

        div.innerHTML = `
          <div class="chat-msg-avatar">
            ${msg.photoURL
              ? '<img src="' + msg.photoURL + '" alt="" class="chat-msg-avatar-img" />'
              : '<span class="chat-msg-avatar-fallback">' + initial + '</span>'
            }
          </div>
          <div class="chat-msg-content">
            <div class="chat-msg-header">
              <span class="chat-msg-name">${msg.displayName || 'Anonymous'}</span>
              <span class="chat-msg-time">${time}</span>
              ${msg.edited ? '<span class="chat-msg-edited">(edited)</span>' : ''}
            </div>
            <div class="chat-msg-text">${escapeHtml(msg.text)}</div>
            ${isOwn ? '<div class="chat-msg-actions"><button class="chat-msg-action-btn" data-action="delete" data-key="' + msg.key + '">Delete</button></div>' : ''}
          </div>
        `;

        // Delete action
        const delBtn = div.querySelector('[data-action="delete"]');
        if (delBtn) {
          delBtn.addEventListener('click', function () {
            if (window.tenet5Chat) window.tenet5Chat.deleteMessage(msg.key);
          });
        }

        return div;
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML.replace(/\n/g, '<br>');
      }

      // ── Send Message ───────────────────────────────────────
      async function handleSend() {
        const text = inputEl.value.trim();
        if (!text || !window.tenet5Chat) return;

        sendBtn.disabled = true;
        const result = await window.tenet5Chat.sendMessage(text);

        if (result.error) {
          document.getElementById('chat-rate-limit').textContent = result.error;
          setTimeout(function () {
            document.getElementById('chat-rate-limit').textContent = '';
          }, 3000);
        } else {
          inputEl.value = '';
          charCount.textContent = '0/2000';
        }

        sendBtn.disabled = false;
        inputEl.focus();
      }

      // ── Input Events ───────────────────────────────────────
      inputEl.addEventListener('input', function () {
        charCount.textContent = inputEl.value.length + '/2000';
        inputEl.style.height = 'auto';
        inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
      });

      inputEl.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSend();
        }
      });

      sendBtn.addEventListener('click', handleSend);
      loginPrompt.addEventListener('click', function () {
        if (window.tenet5Auth) window.tenet5Auth.showLogin();
      });

      // Sidebar toggle
      sidebarToggle.addEventListener('click', function () {
        sidebar.classList.toggle('open');
      });

      // ── Auth State ─────────────────────────────────────────
      function checkAuth() {
        if (window.tenet5Firebase) {
          window.tenet5Firebase.onAuthChange(function (event) {
            isAuthenticated = event.isLoggedIn;
            inputEl.disabled = !isAuthenticated;
            sendBtn.disabled = !isAuthenticated;
            inputEl.placeholder = isAuthenticated
              ? 'Type your message... (Shift+Enter for newline)'
              : 'Sign in to chat';
            emptyEl.style.display = isAuthenticated ? 'none' : 'flex';

            if (isAuthenticated && window.tenet5Chat) {
              // Start listening
              window.tenet5Chat.onMessage(function (msg) {
                messagesEl.appendChild(renderMessage(msg));
                messagesEl.scrollTop = messagesEl.scrollHeight;
              });
              window.tenet5Chat.listenForMessages();
              window.tenet5Chat.listenPresence();
              window.tenet5Chat.onPresenceChange(function (users) {
                onlineCountEl.textContent = users.length;
                onlineListEl.innerHTML = users.map(function (u) {
                  const initial = (u.displayName || '?').charAt(0).toUpperCase();
                  return '<div class="chat-online-user">' +
                    (u.photoURL ? '<img src="' + u.photoURL + '" alt="' + (u.displayName || 'User avatar') + '" class="chat-online-avatar" />' : '<span class="chat-online-avatar-fb">' + initial + '</span>') +
                    '<span>' + (u.displayName || 'Anonymous') + '</span>' +
                  '</div>';
                }).join('');
              });
            }
          });
        } else {
          setTimeout(checkAuth, 300);
        }
      }

      // ── Init ───────────────────────────────────────────────
      buildRooms();
      setTimeout(checkAuth, 200);
    })();
  </script>
</body>
</html>
