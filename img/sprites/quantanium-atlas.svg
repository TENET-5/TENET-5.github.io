<?xml version="1.0" encoding="UTF-8"?>
<!--
  QUANTANIUM Sprite Atlas — v1.0 (2026-04-27)

  Single-file SVG <symbol> atlas. Reference any sprite via:
      <svg class="q-icon"><use href="/img/sprites/quantanium-atlas.svg#q-engine"/></svg>
  Or, if the atlas is injected into the document via js/sprite-loader.js:
      <svg class="q-icon"><use href="#q-engine"/></svg>

  All paths use stroke="currentColor" or fill="currentColor" so colour
  is driven by the parent element. Sizing is via CSS (.q-icon w/h).

  Design: minimal monochrome line-art. Each viewBox is 24x24.
  Strokes are 1.5 for crisp rendering at 16/20/24/32px.

  Owner: TENET5 / LIRIL — site identity gate.
  See /css/sprites.css for class system + /css/QUANTANIUM.json contract.
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">

  <!-- ── ENGINE / SUBSTRATE — ising atom-orbital glyph -->
  <symbol id="q-engine" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5"
       stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="2.2"/>
      <ellipse cx="12" cy="12" rx="9" ry="3.6"/>
      <ellipse cx="12" cy="12" rx="9" ry="3.6" transform="rotate(60 12 12)"/>
      <ellipse cx="12" cy="12" rx="9" ry="3.6" transform="rotate(120 12 12)"/>
    </g>
  </symbol>

  <!-- ── PvNP TIER DOTS -->
  <!-- solvable: filled disc (positive, verified) -->
  <symbol id="q-tier-solvable" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="6" fill="currentColor"/>
  </symbol>
  <!-- np-exposed: ring (review needed) -->
  <symbol id="q-tier-np-exposed" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="6" fill="none"
            stroke="currentColor" stroke-width="2"/>
  </symbol>
  <!-- loom-break: dashed ring (rejected) -->
  <symbol id="q-tier-loom-break" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="6" fill="none"
            stroke="currentColor" stroke-width="2"
            stroke-dasharray="3 2.4"/>
  </symbol>
  <!-- unknown: question dot -->
  <symbol id="q-tier-unknown" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="6" fill="none"
            stroke="currentColor" stroke-width="2"
            stroke-dasharray="1 2.4"/>
  </symbol>

  <!-- ── PULSE DOT -->
  <symbol id="q-pulse" viewBox="0 0 24 24">
    <g fill="currentColor">
      <circle cx="12" cy="12" r="3"/>
      <circle cx="12" cy="12" r="6" fill="none"
              stroke="currentColor" stroke-width="1" opacity="0.45"/>
      <circle cx="12" cy="12" r="9" fill="none"
              stroke="currentColor" stroke-width="0.75" opacity="0.20"/>
    </g>
  </symbol>

  <!-- ── SCENE CHROME -->
  <!-- chevron left -->
  <symbol id="q-chev-left" viewBox="0 0 24 24">
    <path d="M14 6 L8 12 L14 18" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <!-- chevron right -->
  <symbol id="q-chev-right" viewBox="0 0 24 24">
    <path d="M10 6 L16 12 L10 18" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <!-- play -->
  <symbol id="q-play" viewBox="0 0 24 24">
    <path d="M8 5 L19 12 L8 19 Z" fill="currentColor"/>
  </symbol>
  <!-- pause -->
  <symbol id="q-pause" viewBox="0 0 24 24">
    <rect x="7" y="5" width="3.5" height="14" fill="currentColor"/>
    <rect x="13.5" y="5" width="3.5" height="14" fill="currentColor"/>
  </symbol>
  <!-- close x -->
  <symbol id="q-close" viewBox="0 0 24 24">
    <path d="M6 6 L18 18 M18 6 L6 18" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round"/>
  </symbol>

  <!-- ── STATUS GLYPHS -->
  <!-- check (verified) -->
  <symbol id="q-check" viewBox="0 0 24 24">
    <path d="M5 12.5 L10 17.5 L19 7" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <!-- alert (critical, muted) -->
  <symbol id="q-alert" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.7"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3 L21 19 L3 19 Z"/>
      <path d="M12 10 L12 14"/>
      <circle cx="12" cy="17" r="0.4" fill="currentColor"/>
    </g>
  </symbol>
  <!-- info (i) -->
  <symbol id="q-info" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.7"
       stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/>
      <path d="M12 11 L12 16"/>
      <circle cx="12" cy="8" r="0.4" fill="currentColor"/>
    </g>
  </symbol>

  <!-- ── HERALDIC -->
  <!-- maple leaf (simple, monochrome) -->
  <symbol id="q-maple" viewBox="0 0 24 24">
    <path d="M12 3 L13.2 8.4 L18 6 L16.4 11.4 L21 12.4 L17.2 14.6 L18.6 18.4 L14 17.2 L13.2 21.5 L12 19 L10.8 21.5 L10 17.2 L5.4 18.4 L6.8 14.6 L3 12.4 L7.6 11.4 L6 6 L10.8 8.4 Z"
          fill="currentColor"/>
  </symbol>
  <!-- crown (3-point, monochrome line) -->
  <symbol id="q-crown" viewBox="0 0 24 24">
    <path d="M3 18 L3 9 L7 13 L12 5 L17 13 L21 9 L21 18 Z"
          fill="none" stroke="currentColor" stroke-width="1.5"
          stroke-linejoin="round"/>
  </symbol>

  <!-- ── SUBSTRATE NODE — 8-pointed gold star (decorative) -->
  <symbol id="q-substrate-node" viewBox="0 0 24 24">
    <path d="M12 2 L13.5 8.5 L20 8.5 L14.5 12 L20 15.5 L13.5 15.5 L12 22 L10.5 15.5 L4 15.5 L9.5 12 L4 8.5 L10.5 8.5 Z"
          fill="currentColor"/>
  </symbol>

  <!-- ── DOCUMENT / EVIDENCE -->
  <symbol id="q-doc" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 3 L14 3 L19 8 L19 21 L6 21 Z"/>
      <path d="M14 3 L14 8 L19 8"/>
      <path d="M9 13 L16 13 M9 16 L16 16 M9 19 L13 19"/>
    </g>
  </symbol>

  <!-- ── ARCHIVE / LOCK (the record) -->
  <symbol id="q-archive" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.5"
       stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="6" width="18" height="14" rx="1.2"/>
      <path d="M3 11 L21 11"/>
      <path d="M9 14 L15 14"/>
    </g>
  </symbol>

  <!-- ── READING-MODE Aa (mirrors css ::before pseudoelement) -->
  <symbol id="q-reading-mode" viewBox="0 0 24 24">
    <g fill="currentColor" font-family="Inter, sans-serif"
       font-weight="700" font-size="14">
      <text x="2" y="17">A</text>
      <text x="13" y="17" font-size="10">a</text>
    </g>
  </symbol>

</svg>
